<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>營運監察台</title>
<script src="/names.js"></script>
<script src="/md.js"></script>
<script src="/desk.js"></script>
<script src="/orbit.js"></script>
<style>
/* 營運監察台：顏色、按鈕、標記、對話框沿用 desk.js（兩個產品同一套）；以下只係監察台獨有嘅版面。風格沿用創辦人認可嘅協作監察台。 */
.muted{color:var(--muted)}
.small{font-size:var(--fs-sub)}
.ph .r{font-size:var(--fs-label);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-min);color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{flex:none}
.block-card{border-left:3px solid var(--red);margin-bottom:14px}
.block-card .t{font-size:var(--fs-title);font-weight:600}
.block-card .row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.drop{margin-top:8px;border:1px dashed rgba(255,255,255,.28);border-radius:12px;padding:12px;text-align:center}.drop.over{border-color:var(--amber)}
.file-row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:6px;font-size:var(--fs-sub)}
.stack{display:grid;gap:14px}
/* 路徑圖 */
.pmap{position:relative;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.pmap-in{position:relative}
.pmap svg{position:absolute;left:0;top:0;overflow:visible}
.pnode{all:unset;box-sizing:border-box;position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font:600 var(--fs-min) var(--mono);color:var(--muted)}
.pnode:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.pnode[aria-pressed="true"]{box-shadow:0 0 0 2px var(--mint)}
.plab{position:absolute;transform:translateX(-50%);font-size:var(--fs-label);color:var(--text);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;text-align:center;pointer-events:none}
.plab small{display:block;font-size:var(--fs-min);color:var(--muted)}
.plab.retired{text-decoration:line-through;opacity:.5}
.pflag{position:absolute;font-size:var(--fs-min);color:var(--amber);white-space:nowrap;pointer-events:none}
.pbadge{position:absolute;font:var(--fs-min) var(--mono);color:var(--wait);white-space:nowrap;border:1px solid rgba(239,179,127,.55);border-radius:5px;padding:1px 5px;background:#0e0f13}
.pbadge.due{color:var(--red);border-color:rgba(242,162,158,.6)}
.pbars{position:absolute;display:grid;gap:3px}
.pbars i{display:block;width:48px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.pbars i b{display:block;height:100%}
.pcap{position:absolute;display:inline-flex;gap:6px;align-items:center;font-size:var(--fs-label);white-space:nowrap;border:1px solid var(--line);border-radius:5px;padding:2px 6px;background:#0e0f13;color:#c9d0db}
.pcap a,.pcap button{all:unset;cursor:pointer;font-size:var(--fs-min);color:var(--amber);border:1px solid rgba(232,141,79,.45);border-radius:4px;padding:0 5px;line-height:15px}
.pcap a:focus-visible,.pcap button:focus-visible{outline:2px solid var(--mint)}
.pnote{position:absolute;font-size:var(--fs-label);color:var(--amber);text-decoration:none;border:1px dashed rgba(232,141,79,.6);border-radius:5px;padding:1px 7px;white-space:nowrap}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.plist li{display:flex;gap:10px;align-items:flex-start;font-size:var(--fs-sub)}
.plist li.ind{margin-left:24px;padding-left:10px;border-left:1px dashed var(--wait)}
.plist li.ind.sug{border-left-style:dotted;border-left-color:#8795ab}
.plist li.ret{opacity:.5;text-decoration:line-through}
.dot7{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;border:1.5px solid var(--muted)}
.dot7.active{background:var(--blue);border-color:var(--blue);box-shadow:0 0 0 3px rgba(194,214,250,.25)}
.dot7.done{background:var(--mint);border-color:var(--mint)}
.dot7.waiting{border-color:var(--wait)}.dot7.blocked{border-color:var(--red)}
.dot7.sq{border-radius:2px;border-color:var(--wait)}
/* 待你處理同日程 */
.todo{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:minmax(0,1fr)}
.todo .btn{flex:none}
.todo li{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:9px;background:rgba(255,255,255,.015)}
.todo li.overdue{border-left-color:var(--red)}
.todo .ic{width:16px;text-align:center;color:var(--amber);font-size:var(--fs-sub);flex:none}
.todo li.overdue .ic{color:var(--red)}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:var(--fs-body);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .tx small{display:block;font-size:var(--fs-label);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo .tx small em{font-style:normal;color:var(--red)}
.more{display:inline-block;margin-top:8px;font-size:var(--fs-sub);color:var(--amber)}
.sched{list-style:none;margin:0;padding:0}
.sched .dh{font:var(--fs-min) var(--mono);letter-spacing:.1em;color:var(--muted);margin:10px 0 4px;text-transform:uppercase}
.sched .dh:first-child{margin-top:0}
.sched li.it{display:flex;gap:10px;align-items:baseline;font-size:var(--fs-sub);padding:3px 0}
.sched .k{flex:none;font-size:var(--fs-label);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);min-width:58px;text-align:center}
.sched .k.interview{color:var(--mint);border-color:rgba(153,215,188,.5)}
.sched .k.trial{color:var(--wait);border-color:rgba(239,179,127,.55)}
.sched .k.target{color:var(--blue);border-color:rgba(194,214,250,.45)}
.sched .k.decision{color:var(--amber);border-color:rgba(232,141,79,.55)}
.sched li.od .k{color:var(--red);border-color:rgba(242,162,158,.6)}
.sched li.it a{color:var(--text)}
.sched .sub{font-size:var(--fs-label);color:var(--muted)}
/* 範圍列 */
.scope{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 10px;align-items:center}
.scope .lbl{font-size:var(--fs-label);color:var(--muted);margin-right:4px}
.chipb{all:unset;cursor:pointer;font-size:var(--fs-sub);height:28px;padding:0 12px;border:1px solid var(--line);border-radius:7px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chipb:hover{border-color:var(--text);color:var(--text)}
.chipb[aria-pressed="true"]{border-color:var(--mint);color:var(--mint);background:rgba(153,215,188,.07)}
.chipb:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floorp{50%{box-shadow:0 0 34px rgba(232,141,79,.3);border-color:rgba(232,141,79,.45)}}
/* 模組對話框內容 */
.mb{margin-top:6px;font-size:var(--fs-sub);line-height:1.55;color:#cfd5df}
.mb .ln{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb .ln.sub{color:var(--muted);font-size:var(--fs-label)}
.mb .big{font:500 var(--fs-page) var(--mono);color:var(--text)}
.mb a{color:var(--amber)}
/* 慶祝三級（只由創辦人確認過的真實事件觸發）：第 2 級條件達成 2 秒、第 3 級里程碑 3 秒 */
.celebrate b{display:block;font:800 var(--fs-page)/1.2 var(--mono);letter-spacing:.12em;color:#fff}
.celebrate span{display:block;font-size:var(--fs-sub);margin-top:2px}
.celebrate.l2{border-color:var(--blue);background:#101827;color:#e3ecff;box-shadow:0 0 40px rgba(194,214,250,.3);animation-duration:2s}
.celebrate.l2 small{color:var(--blue)}
.celebrate.l3{animation-duration:3s;text-align:center}

/* 業務路徑分頁 */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;font-size:var(--fs-sub);padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(232,141,79,.1);color:#ffc18e}
.seg button:focus-visible{outline:2px solid var(--mint)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:var(--fs-sub)}
.mcard h4{margin:0 0 4px;font-size:var(--fs-body);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mcard dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:var(--fs-sub)}
.mcard dt{color:var(--muted)}
.mcard dd{margin:0}
.mcard.trial{border-color:rgba(239,179,127,.5)}
.mcard.prop{border-style:dashed;opacity:.85}
.mcard.ret{opacity:.5}.mcard.ret h4{text-decoration:line-through}
.grp{margin-top:18px}
.grp>h3{font-size:var(--fs-sub);margin:0 0 8px;color:var(--muted);font-weight:500}
.reqbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:var(--fs-sub);color:var(--muted)}
/* 時間線 */
.tl{position:relative;overflow-x:auto}
.tl-in{position:relative;min-width:760px;padding-top:18px}
.tl-row{position:relative;height:34px;border-bottom:1px solid rgba(255,255,255,.04)}
.tl-row .nm{position:absolute;left:0;top:0;width:140px;height:34px;display:flex;align-items:center;font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tl-row .nm.ret{text-decoration:line-through;opacity:.5}
.tl-axis{position:relative;height:30px;margin-left:140px;border-bottom:1px solid var(--line)}
.tl-axis span{position:absolute;bottom:4px;font:var(--fs-min) var(--mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.tl-mark{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:var(--fs-label);white-space:nowrap}
.tl-dia{width:11px;height:11px;transform:translate(-50%,-50%) rotate(45deg);background:var(--blue);position:absolute;top:50%}
.tl-dia.tent{background:transparent;border:1.5px dashed var(--blue)}
.tl-dia.done{background:var(--mint)}
.tl-bar{position:absolute;top:50%;height:8px;margin-top:-4px;border:1px dashed var(--wait);background:rgba(239,179,127,.12);border-radius:3px}
.tl-dl{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--amber)}
.tl-dl.od{background:var(--red)}
.tl-iv{position:absolute;top:4px;bottom:4px;width:2px;margin-left:-1px;background:rgba(153,215,188,.6)}
.tl-today{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--mint);z-index:2}
.tl-today span{position:absolute;top:0;left:4px;font:var(--fs-min) var(--mono);color:var(--mint);white-space:nowrap}
.tl-tip{position:absolute;top:50%;transform:translate(10px,-50%);font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
.tl-undated{margin-top:12px;font-size:var(--fs-sub);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-legend{margin-bottom:8px}
/* 看板 */
.kb{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:rgba(255,255,255,.015);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.kcol.adhoc{border-style:dashed;border-color:rgba(232,141,79,.35)}
.kcol h4{margin:0 0 8px;font-size:var(--fs-sub);font-weight:600;display:flex;justify-content:space-between;color:var(--muted)}
.kcol h4 b{font:500 var(--fs-sub) var(--mono);color:var(--text)}
.kcol .hint{font-size:var(--fs-label);color:var(--muted);margin:-4px 0 8px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:var(--fs-sub)}
.kcard b{display:block;font-weight:500;line-height:1.4}
.kcard small{display:block;color:var(--muted);font-size:var(--fs-label);margin-top:3px}
.kcard .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.kcard a{color:var(--amber);font-size:var(--fs-label)}
.kcol[data-col="doing"] h4{color:var(--mint)}
.kcol[data-col="waiting"] h4,.kcol[data-col="review"] h4{color:var(--wait)}
.kcol[data-col="blocked"] h4{color:var(--red)}
.empty{font-size:var(--fs-sub);color:var(--muted);padding:6px 2px}
.kcard.mine{border-color:rgba(232,141,79,.45);background:linear-gradient(120deg,rgba(232,141,79,.07),var(--panel) 70%)}
.kcard .wait{color:var(--wait)}
.kcard .why{color:#aab3c2}
.kcard .why b{display:inline;color:var(--muted);font-weight:500}
.tag.ready{border-color:rgba(153,215,188,.55);color:var(--mint)}
.tag.waitc{border-color:rgba(239,179,127,.6);color:var(--wait)}
.tag.you{background:rgba(232,141,79,.14);border-color:rgba(232,141,79,.6);color:#ffc18e}
.pband{position:absolute;font-size:var(--fs-min);white-space:nowrap;color:var(--blue);transform:translateX(-50%);pointer-events:none}
.pband.warn{color:var(--wait)}.pband.bad{color:var(--red)}
.tl-act{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;background:rgba(194,214,250,.22);border:1px solid rgba(194,214,250,.45)}
.tl-you{position:absolute;top:50%;width:0;height:0;margin:-6px 0 0 -6px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--amber)}
.sched .k.action{color:#ffc18e;border-color:rgba(232,141,79,.7);background:rgba(232,141,79,.1)}
/* 其他分頁 */
.rows{display:grid;gap:8px}
.row-item{display:flex;gap:12px;align-items:baseline;font-size:var(--fs-sub);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row-item time{font:var(--fs-label) var(--mono);color:var(--muted);flex:none;min-width:92px}
.row-item .who{font-size:var(--fs-label);color:var(--amber);flex:none;min-width:44px}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolrow input,select{background:#0e0f13;border:1px solid var(--line);color:var(--text);border-radius:7px;height:30px;padding:0 10px;font:inherit;font-size:var(--fs-sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:var(--fs-sub)}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.role{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.role .mcard ul{margin:6px 0 0;padding-left:18px;font-size:var(--fs-sub)}
.celebrate{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:70;padding:12px 22px;border:1px solid var(--mint);border-radius:12px;background:#0f1d18;color:#d9fff2;font-size:var(--fs-title);box-shadow:0 0 40px rgba(153,215,188,.35);animation:cel 4s ease-out forwards}
.celebrate small{display:block;font:var(--fs-min) var(--mono);letter-spacing:.17em;color:var(--mint)}
.ptouch.pflash{animation:pflash 1.2s ease-out 1}
@keyframes pflash{0%{stroke:rgba(153,215,188,1);stroke-width:4}100%{stroke:rgba(153,215,188,.55);stroke-width:1}}
@keyframes cel{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.stalebar{margin-bottom:12px}
.modal.wide{width:min(920px,100%)}
.cmp{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.cmp th,.cmp td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cmp th{font-size:var(--fs-label);color:var(--muted);font-weight:500;width:150px}
.cmp td.cur{background:rgba(255,255,255,.03)}
.cmp thead th{color:var(--text);font-size:var(--fs-sub)}
.cmp thead th.rec{border-bottom:2px solid var(--amber)}
.impact{list-style:none;padding:0;margin:10px 0 0;font-size:var(--fs-sub);display:grid;gap:4px}
.impact li{display:flex;gap:8px;align-items:center}
.impact i{width:6px;height:14px;border-radius:2px;background:var(--line);flex:none}
.impact i.retarget,.impact i.delay{background:var(--wait)}.impact i.add{background:var(--mint)}.impact i.retire{background:var(--red)}
/* 生意大腦（設計稿 2026-10-28 第 4 節）：總覽 + 六個分頁；身份色只用於項目身份（左邊框、圖示、分頁底線），唔用於狀態 */
.wwho{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-label);padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:400}
.wwho.you{border-color:rgba(232,141,79,.6);color:#ffc18e;background:rgba(232,141,79,.1)}
.wwho.ai{border-color:rgba(153,215,188,.5);color:var(--mint)}
.wwho.other{border-color:rgba(194,214,250,.45);color:var(--blue)}
.bnav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bchip{box-sizing:border-box;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-bottom:2px solid var(--line);border-radius:9px 9px 4px 4px;font-size:var(--fs-sub);color:var(--muted);text-decoration:none;background:rgba(255,255,255,.015);white-space:nowrap}
.bchip svg{width:15px;height:15px;stroke:var(--ac,var(--muted));fill:none;stroke-width:1.7;flex:none}
.bchip .no{font:var(--fs-min) var(--mono);color:var(--muted)}
.bchip i{width:7px;height:7px;border-radius:50%;background:#55606f;flex:none}
.bchip[data-s="running"] i{background:var(--amber);animation:blink 1.6s infinite}
.bchip[data-s="waiting"] i{background:var(--wait)}
.bchip[data-s="done"] i{background:var(--mint)}
.bchip:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
.bchip:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.bchip.on{color:var(--text);border-bottom-color:var(--ac,var(--amber));background:rgba(255,255,255,.04)}
.bchip.home.on{border-bottom-color:var(--amber)}
.bnote{font-size:var(--fs-sub);color:var(--wait);border:1px dashed rgba(239,179,127,.5);border-radius:7px;padding:4px 10px;display:inline-block}
ul.evlegend{margin:6px 0 0;padding-left:18px;font-size:var(--fs-label);color:var(--muted)}
ul.evlegend b{color:var(--text);font-weight:500}
.srcbadge{font-size:var(--fs-label);color:var(--blue);border:1px dashed rgba(194,214,250,.5);border-radius:7px;padding:3px 9px;display:inline-block}
.blegend{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-label);color:var(--muted);align-items:center}
details.legend-d{margin:4px 0 8px;font-size:var(--fs-label);color:var(--muted)}
details.legend-d summary{cursor:pointer}
details.legend-d .blegend{margin-top:6px}
.waitstrip{display:grid;gap:6px;margin-top:10px}
.waitstrip ul{margin:0;padding:0;display:grid;gap:6px}
.waitstrip li{list-style:none;display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-left:3px solid var(--ac,var(--amber));border-radius:9px;background:rgba(255,255,255,.015);font-size:var(--fs-sub)}
.waitstrip li>svg{width:18px;height:18px;stroke:var(--ac);fill:none;stroke-width:1.7;flex:none}
.waitstrip .tx{flex:1;min-width:0}
.waitstrip .tx small{display:block;color:var(--muted);font-size:var(--fs-label)}
.btiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.btile{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-left:3px solid var(--ac,#55606f);border-radius:12px;padding:12px 14px;background:linear-gradient(120deg,rgba(17,19,25,.95),rgba(11,13,17,.97));min-width:0;position:relative}
.btile:hover{border-color:rgba(255,255,255,.22);border-left-color:var(--ac)}
.btile:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.btile .bt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.btile h3{margin:0;font-size:var(--fs-title);font-weight:600;display:flex;gap:8px;align-items:center}
.btile h3 .no{font:var(--fs-min) var(--mono);color:var(--muted)}
.bicon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--ac,var(--line));background:color-mix(in srgb,var(--ac,#55606f) 12%,transparent);flex:none}
.bicon svg{width:16px;height:16px;stroke:var(--ac,var(--muted));fill:none;stroke-width:1.7}
.btile dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:var(--fs-sub)}
.btile dt{color:var(--muted);white-space:nowrap}
.btile dd{margin:0;color:#cfd5df;min-width:0}
.btile .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:var(--fs-label);color:var(--muted)}
.btile .foot .go{color:var(--amber);font-size:var(--fs-sub)}
.bbar{height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px}
.bbar b{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--mint));transition:width .6s}
/* 你的意見紀錄（總覽頁底部） */
.fblog{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.fblog li{display:grid;grid-template-columns:110px 110px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--fs-sub);padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.fblog li time{font:var(--fs-label) var(--mono);color:var(--muted)}
.fblog .item{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.fblog .item i{width:8px;height:8px;border-radius:2px;background:var(--ac)}
.fblog .card{color:#cfd5df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fblog .card a{color:var(--amber);text-decoration:none;margin-left:6px;font-size:var(--fs-label)}
.fblog .v{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.fblog .v b{color:var(--mint);font-weight:500}
.fbhit{animation:fbhit 1.8s ease-out}
@keyframes fbhit{0%,30%{box-shadow:0 0 0 2px var(--mint)}100%{box-shadow:0 0 0 2px transparent}}
/* 子頁頁頭 */
.bhead{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bhead .bicon{width:40px;height:40px;border-radius:11px}
/* 陶土 AI 團隊：分頁頁頭成員、冇資料時嘅排列圖 */
.bhead .bmember{width:64px;height:64px;flex:none;border-radius:14px;object-fit:cover;border:1px solid color-mix(in srgb,var(--ac,#55606f) 55%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac,#55606f) 12%,transparent)}
.bband{display:block;width:100%;max-width:760px;height:auto;margin:8px 0 6px;border-radius:12px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
@media (max-width:600px){.bhead .bmember{width:52px;height:52px}}
.bhead .bicon svg{width:22px;height:22px}
.bhead h2{margin:0;font-size:var(--fs-page);font-weight:650;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bhead h2 .no{font:var(--fs-label) var(--mono);color:var(--muted)}
.bhead .sub{font-size:var(--fs-sub);color:var(--muted)}
.bhead .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item-page{border-top:3px solid var(--ac,var(--line))}
/* 1 生意體檢：體檢報告 */
.report{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.weaklist{display:grid;gap:8px}
.weak{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.015);display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px}
.weak .rank{grid-row:1/4;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:700 var(--fs-title) var(--mono);color:var(--c-checkup);border:1px solid rgba(127,214,224,.5);background:rgba(127,214,224,.08)}
.weak h4{margin:0;font-size:var(--fs-body);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.weak .gauge{display:flex;gap:8px;align-items:center;font-size:var(--fs-label);color:var(--muted)}
.weak .gauge .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;max-width:240px}
.weak .gauge .bar b{display:block;height:100%;background:var(--c-checkup)}
.weak dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:var(--fs-sub)}
.weak dt{color:var(--muted)}.weak dd{margin:0}
.weak .fb,.weak .gauge,.weak dl,.weak h4{grid-column:2}
.sidecard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.015);margin-bottom:12px}
.sidecard h4{margin:0 0 6px;font-size:var(--fs-sub);color:var(--c-checkup)}
.sidecard ul{margin:0;padding-left:18px;font-size:var(--fs-sub)}
.sidecard li{margin:4px 0}
.sidecard li small{display:block;color:var(--muted)}
/* 3 情景演練：人物卡牆 */
.persons{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,rgba(201,168,240,.08),rgba(14,15,19,.93) 60%);display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px}
.person.due{border-color:rgba(201,168,240,.55)}
.person .avatar{grid-row:1/5;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:600 var(--fs-title) var(--mono);color:var(--c-scenario);border:1px solid rgba(201,168,240,.6);background:rgba(201,168,240,.1)}
.person h4{margin:0;font-size:var(--fs-title);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.person .t{font-size:var(--fs-sub);color:#cfd5df}
.person .cares{font-size:var(--fs-sub);color:var(--muted)}
.person .act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.person .fb{grid-column:2}
/* 4 商機掃描：時間窗 */
.axis{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:6px 0 14px;padding-top:14px}
.axis:before{content:"";position:absolute;left:0;right:0;top:20px;height:2px;background:linear-gradient(90deg,var(--c-opportunities),rgba(240,210,122,.1))}
.axis span{position:relative;font-size:var(--fs-label);color:var(--muted);text-align:center;padding-top:14px}
.axis span:before{content:"";position:absolute;left:50%;top:2px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#0e0f13;border:1.5px solid var(--c-opportunities)}
.axis span b{display:block;color:var(--c-opportunities);font:600 var(--fs-body) var(--mono)}
.opps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.opp{border:1px solid var(--line);border-top:3px solid var(--c-opportunities);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.015);font-size:var(--fs-sub);display:flex;flex-direction:column;min-width:0}
.opp .pos{font:600 var(--fs-label) var(--mono);color:var(--c-opportunities)}
.opp h4{margin:2px 0 4px;font-size:var(--fs-body);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opp dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.opp dt{color:var(--muted)}.opp dd{margin:0}
/* 5 路線推演：並排比較 */
.cmp.routes th.rowh{width:110px}
.cmp .fb{border-top:0;padding-top:0;margin-top:0}
/* 6 客戶推進追蹤：五格推進板 */
.pipehead{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-sub);color:var(--muted);margin-bottom:8px}
.pipehead b{color:var(--text);font-weight:500}
.pipe .pr.supply{border-left-style:dashed}
.pipe .pr{border-left:3px solid var(--c-pipeline)}
.pr .nm b{display:block;font-size:var(--fs-body)}
.pr .fb{border-top:0;padding-top:4px;margin-top:0}
.stages{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 12px}
.stg{font-size:var(--fs-label);border:1px solid var(--line);border-radius:999px;padding:3px 12px;color:var(--muted)}
.stg.on{border-color:var(--amber);color:#ffc18e;background:rgba(232,141,79,.1)}
.stg.done{border-color:rgba(153,215,188,.6);color:var(--mint)}
.stg-arrow{color:#55606f;font-size:var(--fs-label)}
.wc{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:var(--fs-sub);background:rgba(255,255,255,.015);min-width:0;transition:border-color .4s,box-shadow .4s,opacity .4s}
.wc.blue{border-left:3px solid #7fa7e8}
.wc.red{border-left:3px solid var(--red)}
.wc.ver{border-left:3px solid #55606f;display:flex;flex-direction:column;gap:4px}
.wc.pending{border-style:dashed;color:var(--muted);font-size:var(--fs-sub);display:flex;align-items:center;gap:8px}
.wc.pending.now:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);animation:blink 1.4s infinite;flex:none}
.wc .who{font-size:var(--fs-label);color:var(--red);margin-right:4px}
.wc .sev{font-size:var(--fs-min);color:var(--muted)}
.wc .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.wc.lit{box-shadow:0 0 0 1px var(--amber),0 0 22px rgba(232,141,79,.35)}
.wc.hide{opacity:0}
.vd{font-size:var(--fs-sub);font-weight:600}
.vd.stand{color:var(--mint)}.vd.hurt{color:var(--wait)}.vd.fall{color:var(--red)}
.ev{display:inline-flex;gap:2px;align-items:center;margin-right:5px;vertical-align:-1px}
.ev i{width:9px;height:6px;border-radius:2px;background:rgba(255,255,255,.1)}
.ev i.on{background:var(--mint)}
.evl{font-size:var(--fs-label);color:var(--muted)}
.tag.src-you{border-color:rgba(153,215,188,.55);color:var(--mint)}
.tag.src-ok{border-color:rgba(194,214,250,.5);color:var(--blue)}
.tag.src-ai{border-color:rgba(232,141,79,.55);color:var(--amber)}
.tag.src-read{border-style:dashed}
.tag.src-ext{border-color:rgba(255,255,255,.3);color:var(--text)}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:var(--fs-sub);min-width:0;display:flex;flex-direction:column}
.rcard h4{margin:0 0 6px;font-size:var(--fs-body);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rcard dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:var(--fs-sub)}
.rcard dt{color:var(--muted)}.rcard dd{margin:0}
.rcard.rec{border-color:rgba(232,141,79,.55)}
.rcard .md{font-size:var(--fs-sub)}
.fb{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid rgba(255,255,255,.05)}
.fb .chipb{height:26px;font-size:var(--fs-label)}
.fb input{flex:1 1 180px;min-width:0;background:#0e0f13;border:1px solid var(--line);color:var(--text);border-radius:7px;height:28px;padding:0 10px;font:inherit;font-size:var(--fs-sub)}
.fb .said{font-size:var(--fs-label);color:var(--muted)}
.fb .said b{color:var(--mint);font-weight:500}
.fbrow{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:baseline;font-size:var(--fs-sub);padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;width:100%}
.fbrow:hover span:last-child{color:var(--text)}
.fbrow:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.fbrow b{color:var(--mint);font-weight:500}
.fbhit{animation:fbhit 1.8s ease-out}
@keyframes fbhit{0%,30%{box-shadow:0 0 0 2px var(--mint)}100%{box-shadow:0 0 0 2px transparent}}
.pipe{display:grid;gap:8px}
.pr{display:grid;grid-template-columns:minmax(120px,.9fr) minmax(0,2fr) minmax(0,1.6fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:rgba(255,255,255,.015)}
.track5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.track5 span{font-size:var(--fs-min);color:var(--muted);text-align:center;border-top:3px solid rgba(255,255,255,.08);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track5 span.on{border-top-color:var(--mint);color:var(--text)}
.track5 span.cur{border-top-color:var(--amber);color:#ffc18e;font-weight:600}
.pr small{display:block;color:var(--muted);font-size:var(--fs-label)}
/* 辯論舞台：記分牌、關鍵時刻、身份篩選、對攻列、轉強卡、修訂草案 */
.mhead{display:flex;flex-direction:column;gap:4px;margin:2px 0 6px}
.mhead b{font-size:var(--fs-title)}
.seats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.seats .chipb small{color:var(--muted);font-size:var(--fs-label)}
.sb{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:10px;margin:8px 0 12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:linear-gradient(120deg,rgba(127,167,232,.06),rgba(242,162,158,.05))}
.sb-v{display:flex;gap:14px;align-items:flex-end}
.sb-n{display:flex;flex-direction:column;align-items:center;min-width:48px}
.sb-n strong{font:600 var(--fs-h1)/1.1 var(--mono)}
.sb-n span{font-size:var(--fs-label);color:var(--muted)}
.sb-n.stand strong{color:var(--mint)}.sb-n.hurt strong{color:var(--wait)}.sb-n.fall strong{color:var(--red)}
.sb-m{min-width:0}
.sb-m label{display:block;font-size:var(--fs-label);color:var(--muted)}
.sb-m strong{display:block;font:500 var(--fs-page)/1.3 var(--mono)}
.sb-m strong.na{font:var(--fs-sub)/1.5 var(--ui);color:var(--muted)}
.sb-m small{display:block;font-size:var(--fs-label);color:var(--muted)}
.sb-o,.sb-d{grid-column:1/-1;margin:2px 0 0;font-size:var(--fs-sub)}
.sb-d{color:var(--muted)}
.evbar{display:flex;height:16px;border-radius:4px;overflow:hidden;margin:4px 0 2px;background:rgba(255,255,255,.06)}
.evbar i{display:grid;place-items:center;font:600 var(--fs-min) var(--mono);color:#0b0d12;font-style:normal;min-width:14px}
.evbar .e0{background:#55606f;color:var(--text)}.evbar .e1{background:#8aa0c8}.evbar .e2{background:#7cc4a5}.evbar .e3{background:#99d7bc}.evbar .e4{background:#c8f0dc}
.kms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:0 0 10px}
.km{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-top:3px solid var(--amber);border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.02);font-size:var(--fs-sub);min-width:0}
.km:hover{border-color:rgba(255,255,255,.25)}
.km:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.km[data-kind="一擊倒下"]{border-top-color:var(--red)}.km[data-kind="盲點"]{border-top-color:var(--wait)}.km[data-kind="反轉"]{border-top-color:var(--mint)}.km[data-kind="漏咗嘅路"]{border-top-color:#7fa7e8}
.km-k{font-size:var(--fs-label);letter-spacing:.08em;color:var(--muted)}
.km small{color:var(--muted);font-size:var(--fs-label)}
.km small.who{color:var(--red)}
.seatview{border:1px dashed rgba(242,162,158,.45);border-radius:10px;padding:10px 14px;margin:8px 0;background:rgba(242,162,158,.04)}
.seatview h4{margin:0 0 6px;font-size:var(--fs-body)}
.wc .side{display:block;font-size:var(--fs-min);letter-spacing:.12em;color:var(--muted);margin-bottom:3px}
.wc.dim{opacity:.32}
.atk{padding:4px 0 6px;border-bottom:1px dashed rgba(255,255,255,.07);transition:opacity .4s}
.atk:last-child{border-bottom:0;padding-bottom:0}
.atk-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.more{font-size:var(--fs-label);color:var(--muted);margin-top:3px}
.more summary{cursor:pointer;color:var(--muted)}
.more p{margin:3px 0}
.reb{margin-top:5px;padding:5px 8px;border-left:2px solid #7fa7e8;background:rgba(127,167,232,.06);border-radius:0 6px 6px 0;font-size:var(--fs-sub);transition:opacity .4s}
.rb-who{font-size:var(--fs-min);color:#9fbcf0;margin-right:5px}
.stamp{display:inline-block;font-weight:700;font-size:var(--fs-sub);border:2px solid currentColor;border-radius:6px;padding:0 7px;transform:rotate(-4deg);letter-spacing:.06em}
.stamp.stand{color:var(--mint)}.stamp.hurt{color:var(--wait)}.stamp.fall{color:var(--red)}
.pts{font:600 var(--fs-label) var(--mono);color:var(--muted)}
.fresp{margin-bottom:12px;max-width:760px}
.tcards{display:grid;gap:8px}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid #55606f;border-radius:12px;font-size:var(--fs-sub);min-width:0;transition:box-shadow .4s,opacity .4s}
.tc-sum{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;padding:8px 14px}
.tc-sum:focus-visible,.c-sum:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.tc-sum .ba1{min-width:0;font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sum .ba1 s{color:var(--muted);text-decoration-color:rgba(242,162,158,.5)}
.tc-sum .ba1 .arr{color:var(--muted);margin:0 6px}
.tc-sum .cid{font:600 var(--fs-label) var(--mono)}
.tc-sum .tg{display:flex;gap:6px;align-items:center}
.tc-body{padding:4px 14px 12px;border-top:1px dashed rgba(255,255,255,.07);display:flex;flex-direction:column;gap:4px}
.h3s{font-size:var(--fs-sub);color:var(--muted);margin:14px 0 6px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h3s .r{margin-left:auto;display:flex;gap:6px}
.claims{display:grid;gap:6px}
.claim{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.015);min-width:0;transition:box-shadow .4s}
.claim.open{border-color:rgba(255,255,255,.2)}
.claim.dim{opacity:.35}
.claim.lit{box-shadow:0 0 0 1px var(--amber),0 0 22px rgba(232,141,79,.35)}
.c-sum{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;width:100%;padding:8px 12px;font-size:var(--fs-sub)}
.c-sum .cid{font:600 var(--fs-label) var(--mono);color:#9fbcf0}
.c-sum .ct{min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.c-sum .ct b{font-weight:500}
.c-sum .n{font-size:var(--fs-label);color:var(--muted);white-space:nowrap}
.c-sum .n em{font-style:normal;color:var(--red)}
.c-sum .caret{color:var(--muted);font-size:var(--fs-label);white-space:nowrap}
.c-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,.8fr);gap:8px;padding:4px 12px 12px;border-top:1px dashed rgba(255,255,255,.07)}
.c-body .wc .side{display:block}
details.sec{border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-top:10px;background:rgba(255,255,255,.01)}
details.sec>summary{cursor:pointer;font-size:var(--fs-sub);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.sec>summary small{color:var(--muted);font-weight:400;font-size:var(--fs-label)}
details.sec[open]>summary{margin-bottom:8px}
.risks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.decide{margin-top:10px;border:1px solid rgba(232,141,79,.35);border-radius:12px;padding:12px 16px;background:linear-gradient(180deg,rgba(232,141,79,.07),rgba(14,15,19,.93) 75%)}
.decide h4{margin:0 0 6px;font-size:var(--fs-body)}
.halfbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}

.mcell.ok{background:rgba(153,215,188,.1);border-color:rgba(153,215,188,.5)}

.wg-go{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}

  }

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 系統頁：觀察資料夾 */
.obs-list{list-style:none;margin:0 0 6px;padding:0;display:grid;gap:4px}
.obs-list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.obs-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.obs-in{flex:1 1 180px;min-width:0;background:#0e0f13;border:1px solid var(--line);color:var(--text);border-radius:7px;height:28px;padding:0 10px;font:inherit;font-size:var(--fs-sub)}
/* ===== 公司現況第三版（設計稿 2026-10-30；數值見視覺規格第 3、5 節；全部字級只由 --fs-* 取值） ===== */
/* 卡：外框平時靜止（決定二十六）；內容真係改變（.updated／.flow）先閃一下、流動邊框轉兩週即停；運作環卡只喺 AI 真實工作期間轉（.live） */
.panel{padding:12px 16px;min-width:0;isolation:isolate;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .3s}
.panel:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.2);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 26px 50px -22px rgba(0,0,0,.85),0 0 0 1px rgba(232,141,79,.08)}
.panel:before{content:"";position:absolute;inset:-1px;border-radius:calc(var(--r-card) + 1px);padding:1px;background:conic-gradient(from var(--ang,0deg),transparent 0 58%,rgba(232,141,79,.85) 82%,#ffe0c2 88%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;pointer-events:none;z-index:-1}
.panel.flow:before{opacity:1;animation:ring var(--flow) linear 2}
.panel.flow.running:before{animation-iteration-count:infinite}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ring{to{--ang:360deg}}
body.settled .panel.updated{animation:ov-panel-flash .32s ease-out}
.panel.updated:after{height:2px;left:0;right:0;background:linear-gradient(90deg,transparent,var(--amber),var(--mint),transparent);background-size:40% 100%;background-repeat:no-repeat;background-position:-40% 0;animation:ov-panel-sweep .5s ease-out}
.ph{display:flex;align-items:baseline;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:8px}
.ph h2{margin:0;font-size:var(--fs-title);font-weight:600;letter-spacing:.02em;line-height:1.3}
.ph .sub,.sub{font-size:var(--fs-sub);color:var(--muted)}
.ph.sect{margin:14px 0 0}
.band{display:grid;gap:10px;margin-top:10px}
.band.b{grid-template-columns:minmax(0,2.1fr) minmax(0,1fr)}
.legend{display:flex;gap:14px;font-size:var(--fs-min);color:var(--muted);flex-wrap:wrap;align-items:center}
.tele{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:var(--fs-min);color:var(--muted);font-family:var(--mono)}
.phtele{display:inline-flex;gap:12px;align-items:center;font-size:var(--fs-min);color:var(--muted);font-family:var(--mono)}
.phtele .hb{display:inline-flex;align-items:center;gap:6px}.phtele .hb svg{width:14px;height:14px}
.phtele .hb circle.base{fill:none;stroke:rgba(153,215,188,.25);stroke-width:2}
.phtele .hb circle.arc{fill:none;stroke:var(--mint);stroke-width:2;stroke-dasharray:31.4;stroke-dashoffset:31.4;transform:rotate(-90deg);transform-origin:50% 50%;animation:hbarc 5s linear infinite}
@keyframes hbarc{to{stroke-dashoffset:0}}
.phtele .cd{color:var(--text)}
.num{font:500 var(--fs-num)/1.15 var(--mono);letter-spacing:-1px;display:inline-block;font-variant-numeric:tabular-nums}
.num.tick{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(1.25);color:#ffd3ae;text-shadow:0 0 18px rgba(232,141,79,.8)}100%{transform:none}}
/* A 帶壓縮條（方案 B）：里程碑量尺條＋小旗＋範圍＋待你處理三個數與首項 */
.band.strip{grid-template-columns:minmax(0,1fr) 420px;align-items:stretch;margin-top:8px}
.strip-panel{padding:7px 12px 6px}
.strip-cap{display:flex;justify-content:space-between;gap:12px;font-size:var(--fs-min);color:var(--muted);margin:0 2px 5px;white-space:nowrap;overflow:hidden}
.strip-cap b{color:#d9dde4;font-weight:500}.strip-cap .flag{color:#ffc18e;overflow:hidden;text-overflow:ellipsis}
.strip-row{display:flex;gap:6px;min-width:0}
.strip-row .stages{display:flex;gap:6px;flex:1;min-width:0}
.st-stage{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;gap:9px;padding:7px 10px;height:52px;border:1px solid var(--line);border-radius:9px;background:rgba(16,17,22,.6);min-width:0;flex:1 1 0;text-align:left;transition:border-color .2s,background .2s,box-shadow .2s;color:var(--text)}
.st-stage.scope{flex:0 0 auto}
.st-stage:hover{border-color:rgba(255,255,255,.2)}
.st-stage:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.st-stage .num{color:#737a8c;font:var(--fs-min) var(--mono);flex:none;letter-spacing:0}
.st-stage .tx{min-width:0;flex:1}
.st-stage b{display:block;font-size:var(--fs-label);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.st-stage small{display:block;color:var(--muted);font-size:var(--fs-min);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.st-stage .dots{display:flex;gap:3px;flex:none}.st-stage .dots i{height:12px;width:3px;background:#343740;border-radius:1px}
.st-stage .dots i.on{background:rgba(153,215,188,.55)}
.st-stage.done .num{color:var(--mint)}.st-stage.done .dots i.on{background:rgba(153,215,188,.75)}
.st-stage.active{border-color:rgba(232,141,79,.5);background:linear-gradient(105deg,rgba(42,27,20,.53),rgba(16,17,22,.6));box-shadow:0 0 18px rgba(232,141,79,.09)}
.st-stage.active .num,.st-stage.active small{color:#ffc18e}.st-stage.active .dots i.on{background:var(--amber)}
.st-stage.active:after{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;background:linear-gradient(100deg,transparent 35%,rgba(255,193,142,.08) 50%,transparent 65%);background-size:250% 100%;animation:ov-stage-glow 3.6s ease-in-out infinite}
body.has-work .st-stage.active:before{content:"";position:absolute;left:-32%;bottom:0;width:32%;height:2px;background:linear-gradient(90deg,transparent,var(--mint),transparent);opacity:.8;animation:ov-stage-band 2.4s linear infinite}
.st-stage.on{outline:2px solid var(--mint);outline-offset:1px;border-color:var(--mint);background-color:rgba(153,215,188,.07)}
.st-stage.on .num{color:var(--mint)}
.st-stage.ptouch{box-shadow:0 0 0 1px rgba(194,214,250,.45) inset}
.st-stage .fl{color:#ffc18e;font-size:var(--fs-label);flex:none}.st-stage .fl.pend{opacity:.55}
.st-stage .dots.charge i{animation:ov-charge-dot 1.2s ease-out both;animation-delay:calc(var(--k,0)*.18s)}
.strip-desc{display:flex;gap:8px;align-items:center;margin-top:5px;min-height:18px;font-size:var(--fs-min);color:var(--muted);white-space:nowrap;overflow:hidden}
.strip-desc b{color:#d9dde4;font-weight:500}.strip-desc a{margin-left:auto;color:#ffc18e;text-decoration:none}.strip-desc a:hover{text-decoration:underline;text-underline-offset:4px}
.todo-mini{padding:8px 12px 7px}
.todo-mini .ph{margin-bottom:2px;flex-wrap:nowrap;gap:8px}.todo-mini h2{font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.todo-mini .phr{display:flex;gap:12px;align-items:center;flex:none;white-space:nowrap}.todo-mini .phr a{color:var(--amber);text-decoration:none;font-size:var(--fs-label)}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 6px}
.counts .needn{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:8px;padding:2px 9px;line-height:1.3;background:rgba(255,255,255,.015);transition:border-color .2s}
.counts .needn:hover{border-color:rgba(255,255,255,.25)}
.counts .needn.hot{border-color:rgba(232,141,79,.55);box-shadow:inset 0 0 24px rgba(232,141,79,.08)}
.counts label{display:block;font-size:var(--fs-min);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:inherit}
.counts .num{font-size:var(--fs-title);line-height:1.2;letter-spacing:0}
.todo-mini .row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 10px;border-left:3px solid var(--amber);border-radius:0 9px 9px 0;background:linear-gradient(90deg,rgba(232,141,79,.06),rgba(255,255,255,.015) 40%)}
.todo-mini .row:hover{background:linear-gradient(90deg,rgba(232,141,79,.1),rgba(255,255,255,.03) 40%)}
.todo-mini .row.over{border-left-color:var(--red)}
.todo-mini .row .ic{font-size:var(--fs-sub);color:var(--amber);text-align:center}.todo-mini .row.over .ic{color:var(--red)}
.todo-mini .row .tx{min-width:0}.todo-mini .row .t{font-size:var(--fs-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo-mini .row .s{display:none}
.todo-mini .row .btn{height:26px;padding:0 10px;font-size:var(--fs-label)}
.todo-mini .empty{margin:2px 0 0}
/* ---------- 運作環容器與層（第三版骨架：左人類核心＋三膠囊、中立方體＋會話環、右任務欄） ---------- */
.orbit-panel .ph{margin-bottom:6px}
.orbit{position:relative;height:480px;border-radius:12px;overflow:hidden;perspective:900px;isolation:isolate;border:1px solid var(--line);background:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.5px) 0 0/26px 26px,radial-gradient(ellipse at 52% 50%,rgba(42,27,20,.22),transparent 66%),#0a0b0e}
@media (min-width:1600px) and (min-height:950px){.orbit{height:560px}}
.o-scan{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(153,215,188,.09) 50%,transparent);background-size:30% 100%;background-repeat:no-repeat;background-position:-40% 0}
.orbit[data-level="1"] .o-scan{opacity:.5;animation:ov-scan 14s linear infinite}
.orbit[data-level="2"] .o-scan{opacity:.75;animation:ov-scan 11s linear infinite}
.orbit[data-level="3"] .o-scan{opacity:1;animation:ov-scan 8.5s linear infinite}
.o-floor{position:absolute;left:8%;right:8%;top:30%;bottom:6%;border-radius:50%;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(111,134,184,.10),rgba(111,134,184,.03) 45%,transparent 70%)}
.o-floor:before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(ellipse at 50% 55%,transparent 0 25px,rgba(255,255,255,.05) 25px 26px)}
.orbit.has-work .o-floor{background:radial-gradient(ellipse at 50% 55%,rgba(232,141,79,.14),rgba(232,141,79,.04) 45%,transparent 70%)}
.o-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.o-stage{position:absolute;inset:0;z-index:2}
.o-stage>*{position:absolute}
.o-fog{position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(180deg,rgba(6,6,8,.42),rgba(6,6,8,.14) 28%,transparent 50%)}
.o-fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.o-fxa{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.orbit.offline .o-canvas{opacity:.6}
.o-head{left:12px;right:12px;top:8px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:var(--fs-min);color:var(--muted);pointer-events:none;z-index:4}
.o-head .l{display:flex;gap:10px;align-items:center;min-width:0;overflow:hidden;white-space:nowrap}
.o-foot .hb,.o-foot .lp{font-family:var(--mono)}.o-foot .lp b{color:#abb4c2;font-weight:400}
.o-simban{font:var(--fs-min) var(--mono);letter-spacing:.08em;color:#ffc18e;border:1px dashed rgba(232,141,79,.55);border-radius:5px;padding:1px 7px;background:rgba(232,141,79,.08)}
.o-scope{color:#d9dde4}
.o-gauge{left:14px;top:30px;width:200px;font-size:var(--fs-min);color:var(--muted);pointer-events:none;z-index:3}
.o-gauge .grow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;line-height:1.25}
.o-gauge .grow b{font:500 var(--fs-label) var(--mono);color:#e6eaf1}
.o-gauge .gbars{display:flex;gap:3px;height:6px;margin-bottom:5px}
.o-gauge .gbars i{flex:1;background:#262a33;border-radius:1px;transition:background .25s,box-shadow .25s}
.o-gauge .gbars i.on{background:linear-gradient(90deg,var(--amber),var(--mint));box-shadow:0 0 6px rgba(232,141,79,.4)}
.o-gauge .idle-note{display:none;margin-top:6px;color:#aeb7c4;line-height:1.5;border-left:2px solid #3a414d;padding-left:7px}
.orbit[data-level="0"] .o-gauge .idle-note{display:block}
.orbit.tight .o-gauge .idle-note{display:none}
.o-eyebrow{display:block;font-size:var(--fs-min);letter-spacing:.17em;text-transform:uppercase;color:var(--amber);font-weight:600;white-space:nowrap}
.o-human{text-align:center;transform:translateX(-50%);z-index:3;width:180px}
.o-hnode{position:relative;width:70px;height:70px;margin:6px auto 5px;border:1px solid rgba(232,141,79,.32);border-radius:50%;background:radial-gradient(circle,rgba(232,141,79,.13),transparent 70%);box-shadow:0 0 50px rgba(232,141,79,.05),inset 0 0 20px rgba(232,141,79,.04);animation:ov-float 5s ease-in-out infinite;display:grid;place-items:center}

.o-htitle{display:block;font-size:var(--fs-sub);font-weight:600;letter-spacing:.08em;line-height:1.25}
.o-text{all:unset;cursor:pointer;display:block;margin:0 auto;font-size:var(--fs-min);color:#ffc18e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* 陶土公仔動作：真 AI 工作時先郁（定格式一格格跳，跟工作強度變快）；閒置只有統籌成員偶然縮一縮身；暫停動效同減少動態全部唔郁 */
.orbit{--bob:1.2s}
.orbit[data-level="2"]{--bob:.95s}

      h('div', { class: 'pipe', id: 'pipeline' }, list.map(function (p) {
        var supply = /供應/.test(p.kind || '');
        return h('div', { class: 'pr' + (supply ? ' supply' : '') }, h('div', { class: 'nm' }, h('b', null, p.name), h('small', null, supply ? D.kindSupply : D.kindCustomer)),
          h('div', null, h('div', { class: 'track5' }, STAGE5.map(function (s, i) { return h('span', { class: i < p.stage ? 'on' : i === p.stage ? 'cur' : '' }, s); })),
            p.lastReal ? h('small', null, D.lastRealL + '：' + p.lastReal + (p.lastAt ? '（' + md(p.lastAt) + '）' : '')) : null, p.rehearsal ? h('small', null, tag(D.rehearsalTag, 'src-ai'), ' ', p.rehearsal.replace(/^演練：/, '').replace(/（唔計證據）$/, '')) : null),
          h('div', null, h('small', null, D.nextStepL), p.next, p.nextBy === 'ai' ? [' ', tag('AI 建議 · 未確認', 'src-ai')] : null, p.practiceId ? h('div', null, h('a', { href: '/#/practice/' + p.practiceId }, '🎭 ' + D.practiceGo + ' →')) : null, p.material ? h('div', null, h('a', { href: '#', onclick: function (e) { e.preventDefault(); showRun(p.material.runId, p.material.title); } }, D.materialL + '：' + p.material.title)) : null, fbBar(x.id, 'pipe-' + p.id)));
      }))]);
  }
  // 新出現嘅推進項目亮一下（兩次讀回之間；首次載入唔亮）
  function flashNew() {
    var w = brainItem('wargame').detail;
    if (!w) return;
    var keys = wgKeys(w), seen = V.wgSeen;
    V.wgSeen = keys;

      var el = document.querySelector('[data-k~="' + k + '"]');
      if (el) { el.classList.add('lit'); setTimeout(function () { el.classList.remove('lit'); }, 2200); }
    });
  }

  /* ---------- 畫 ---------- */
  function render(force) {
    var x = V.data;

    // 舊深連 /dashboard/brain#b-<項目> 轉去分頁網址
    var ob = tab === 'brain' && !sub && /^#b-([a-z]+)$/.exec(location.hash);
    if (ob && ITEMS.indexOf(ob[1]) >= 0) { location.replace(brainHref(ob[1]) + location.search); return; }

    document.body.classList.toggle('paused', !!V.paused);
    document.body.classList.toggle('has-work', !!(x.work && x.work.meta.workingSessions));
    var shell = $('#shell');
    // 頁頭同導航只畫一次；之後由共用殼就地更新指標、徽章同連線狀態
    if (!V.built) {
      V.built = true;
      shell.replaceChildren(DESK.shell({ tab: tab, sub: sub ? D['brain_' + sub] : null, company: x.company, metrics: x.metrics, pending: (x.todo || []).length, sample: x.sample, sim: x.sim ? { clock: md(x.sim.clock) + ' ' + hm(x.sim.clock) } : null, since: tab === 'overview' ? sinceLine() : null }), h('main', { id: 'app' }));
    }
    var sb = $('#sim-badge'); if (sb && x.sim) { var st = N.ui.simBadge + ' · ' + N.ui.simClock + ' ' + md(x.sim.clock) + ' ' + hm(x.sim.clock); if (sb.textContent !== st) sb.textContent = st; }
    if (V.stale && !$('.stalebar')) $('#desk-head').append(h('div', { class: 'track off stalebar' }, h('b', null, '伺服器已重新啟動：'), '請重新載入。 ', h('button', { type: 'button', class: 'btn primary', onclick: function () { location.reload(); } }, '重新載入')));
    // 公司現況：就地更新（唔重畫成頁）
    if (tab === 'overview') { if (!$('#ov')) { $('#app').replaceChildren(pageOverview()); } refreshOverview(force === 'scope'); return; }
    var y = window.scrollY;
    // 讀回重畫時保留打緊嘅意見同游標
    var fbEl = $('#fb-text'), fbKeep = fbEl ? fbEl.value : null, fbFocus = fbEl && document.activeElement === fbEl;
    var openKeep = [].slice.call(document.querySelectorAll('details[data-keep]')).filter(function (e) { return e.open; }).map(function (e) { return e.getAttribute('data-keep'); });
    var main = $('#app'); main.replaceChildren();
    add(main, { path: pagePath, brain: pageBrain, inputs: pageInputs, team: pageTeam, log: pageLog, system: pageSystem }[tab]());
    if (tab === 'brain') flashNew();
    // 深連 #card=<卡>：第一次畫好先捲去嗰張卡
    if (sub && V.goCard && !V.goCardDone) { V.goCardDone = true; setTimeout(function () { goCard(sub, V.goCard); }, 60); }
    if (fbKeep != null && $('#fb-text')) { $('#fb-text').value = fbKeep; if (fbFocus) $('#fb-text').focus(); }
    openKeep.forEach(function (k) { var e = document.querySelector('details[data-keep="' + k + '"]'); if (e) e.open = true; });
    if (force) window.scrollTo(0, y);
  }
  /* ---------- 讀回（每 5 秒；有變先重畫）同達成特效 ---------- */
  // 慶祝三級（設計稿第 2.4 節）：只喺連續兩次讀回之間見到創辦人確認過嘅真實轉變先播一次；
  // 首次載入、重連、離線、暫停動效、減少動態、分頁隱藏時唔播（只更新數字同顏色）。唔做經驗值、等級、連擊。
  function reached(w) { return !!w && w.target != null && w.target !== '' && Number(w.value) >= Number(w.target); }
  function banner(level, small, big, text, fx) {
    var inOrbit = tab === 'overview' && window.ORBIT && window.innerWidth > 600 && $('#orbit') && $('#orbit').childNodes.length;
    var el = h('div', { class: 'celebrate l' + level + (inOrbit || !DESK.fx() ? ' sr' : ''), role: 'status', 'data-level': String(level) }, h('small', null, small), h('b', null, big), h('span', null, text));
    document.body.append(el); setTimeout(function () { el.remove(); }, level === 3 ? 3200 : 2200);
    if (inOrbit && fx) ORBIT.celebrate(level, fx);
  }
  function celebrate(prev, next, wasLive) {
    if (!prev || !wasLive || V.paused || REDUCED || document.hidden) return;
    // 路徑事件：受影響節點亮一次（只喺兩次 Live 讀回之間新出現先亮）
    (next.pathTouched || []).filter(function (id) { return (prev.pathTouched || []).indexOf(id) < 0; }).forEach(function (id) {
      var el = document.querySelector('.ptouch[data-ms="' + id + '"]');
      if (el) { el.classList.add('pflash'); setTimeout(function () { el.classList.remove('pflash'); }, 1400); }
    });
    var before = {}; (prev.milestones || []).forEach(function (m) { before[m.id] = m; });
    var ms = next.milestones || [], fired = false;
    // 3 里程碑完成（創辦人確認轉 done）：橫幅三秒，寫明下一站
    ms.forEach(function (m) {
      var b = before[m.id];
      if (!b || fired || !(b.state !== 'done' && m.state === 'done' && m.pathStatus === 'confirmed')) return;
      var nx = ms.filter(function (z) { return z.pathStatus === 'confirmed' && z.state !== 'done' && (z.order || 0) > (m.order || 0); }).sort(function (a, c) { return (a.order || 0) - (c.order || 0); })[0];
      banner(3, D.celebrateL, D.stageClear, D.milestoneDone + '：' + m.short + (nx ? ' → 下一站：' + nx.short : ''), { stageName: m.short, nextName: nx ? nx.short : '' }); fired = true;
    });
    // 2 條件達成（觀察項達目標或試行轉正）：橫幅兩秒
    if (!fired) ms.forEach(function (m) {
      var b = before[m.id]; if (!b || fired) return;
      var promoted = b.pathStatus === 'trial' && (m.pathStatus === 'confirmed' || (m.trial && m.trial.verdict === 'promoted' && !(b.trial && b.trial.verdict)));
      var hit = (m.watchItems || []).filter(function (w) { return reached(w) && !reached((b.watchItems || []).filter(function (z) { return z.id === w.id; })[0]); })[0];
      if (!promoted && !hit) return;
      var crit = msCriteria(m), met = crit.filter(function (c) { return c.met; }).length;
      banner(2, D.celebrateL, D.objectiveDone, promoted ? D.trialPromoted + '：' + m.short : hit.label + '：' + hit.value + '／' + hit.target, { text: promoted ? D.trialPromoted + '：' + m.short : hit.label + '：' + hit.value + '／' + hit.target, k: met, m: crit.length }); fired = true;
      V.charge = Date.now(); setTimeout(function () { if (tab === 'overview') refreshOverview(true); }, 2600);
    });
    // 1 任務交付（驗收通過或你的行動答「做咗」）：事件流一行上滑＋任務節點短閃
    var bt = {}; (prev.tasks || []).forEach(function (z) { bt[z.id] = z; });
    (next.tasks || []).forEach(function (z) {
      var b = bt[z.id]; if (!b || b.column === 'done' || z.column !== 'done') return;
      var list = $('#evlist');
      if (list) list.prepend(h('li', { class: 'ev fresh kill', 'data-delivered': z.id, 'data-until': String(Date.now() + 15000) }, h('time', { class: 'at' }, hm(next.now)), h('span', { class: 'who you' }, D.logYou), h('span', { class: 'tt' }, '✓ ' + D.taskDelivered + '：' + z.title)));
      if (!fired && tab === 'overview' && window.ORBIT && window.innerWidth > 600) { var ses = ((next.work || {}).sessions || []).filter(function (q) { return (q.taskIds || []).indexOf(z.id) >= 0; })[0]; ORBIT.celebrate(1, { taskId: z.id, sessionKey: ses ? ses.key : '' }); fired = true; }
    });
  }
  // 只重畫運行狀態（唔郁頁頭、路徑圖、待你處理、生意大腦摘要）
  // 只係運行狀態變咗（會話、觀測、分類索引狀態）：公司現況就地更新；系統頁同團隊頁重畫內容
  function renderWork() {
    var x = V.data;
    document.body.classList.toggle('has-work', !!(x.work && x.work.meta.workingSessions));
    if (tab === 'overview') refreshOverview(false);
    else if (tab === 'system') { var so = $('#sys-observe'); if (so && so.contains(document.activeElement)) return; render(true); }
    else if (tab === 'team') render(true);
  }
  function load() {
    return get('/api/dashboard').then(function (j) {
      if (!j || !j.ok || !Array.isArray(j.milestones)) throw new Error('bad');
      if (V.instance && j.instance !== V.instance) V.stale = true;
      V.instance = V.instance || j.instance;
      // 規劃書 4.9：內容（帳本、問題包、run 狀態）變咗先整頁重畫；observed／work 變咗只重畫作業網、事件流、分類索引同系統頁清單
      var TIME = { now: 1, readAt: 1, lastActiveAt: 1, reportedAt: 1, clock: 1 };
      var key = JSON.stringify(j, function (k, v) { return TIME[k] || k === 'work' || k === 'observed' || k === 'activity' ? undefined : v; });
      var wkey = JSON.stringify({ w: j.work, o: j.observed, a: j.activity, t: (j.teammates || []).map(function (t) { return t.activity; }) }, function (k, v) { return TIME[k] ? undefined : v; });
      var wasLive = V.conn === 'live', changed = key !== V.hash || !wasLive, workChanged = wkey !== V.whash;
      var prev = V.data;
      V.hash = key; V.whash = wkey; V.data = j; V.conn = 'live'; V.readAt = Date.now();
      DESK.update(j);
      if (changed) { if (V.replaying) V.dirty = true; else render(!!prev); celebrate(prev, j, wasLive); pulses(prev, j, wasLive); }
      else if (workChanged) { if (V.replaying) V.dirty = true; else renderWork(); pulses(prev, j, wasLive); }
    }).catch(function () {
      V.conn = 'offline'; DESK.setConn('offline');
      if (V.data) { if (tab === 'overview') refreshOverview(true); }
      else $('#shell').replaceChildren(h('section', { class: 'panel block-card' }, h('span', { class: 'eyebrow' }, D.offline), h('p', null, '營運監察台尚未開啟：請在 Claude 輸入 /startup-os:dashboard，或要求 AI「打開營運監察台」，即可重新開啟。')));
    });
  }
  function poll() { setTimeout(function () { (document.hidden ? Promise.resolve() : load()).then(poll, poll); }, 5000); }
  window.addEventListener('focus', load);
  // 深連 #<里程碑>：同一頁只改 # 都要預選範圍
  window.addEventListener('hashchange', function () { if (tab === 'brain') return; var m = /^#([\w-]{1,40})$/.exec(location.hash); V.scope = m ? m[1] : 'all'; if (tab === 'overview') refreshOverview(true); else render(true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
  var rz = null; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { if (tab === 'overview') syncOrbit(true); else render(true); }, 200); });
  // 暫停動效、特效開關（共用殼工具列）；立即讀回
  DESK.onPause(function (p) { V.paused = p; if (window.ORBIT) ORBIT.setPaused(p || REDUCED); if (tab !== 'overview') render(true); });
  DESK.onFx(function (on) { if (window.ORBIT) ORBIT.setFx(on); });
  DESK.onRefresh(function () { load(); DESK.toast(D.readNow); });
  // 每秒：收件匣處理中已用時間；每分鐘：「最早一項已等」（本機時鐘，唔打網路）
  setInterval(function () { var w = V.data && V.data.work; if (w && w.inbox && w.inbox.processing) { var b = document.querySelector('[data-node="need:inbox"] b'); if (b) b.textContent = D.processingL + ' ' + mmss((w.inbox.elapsedSeconds || 0) + Math.round((Date.now() - (V.readAt || Date.now())) / 1000)); } }, 1000);
  setInterval(function () { [].forEach.call(document.querySelectorAll('[data-wait]'), function (e) { var t = waitText(e.getAttribute('data-wait')); if (e.textContent !== t) e.textContent = t; }); }, 60000);
  load().then(poll);
})();
