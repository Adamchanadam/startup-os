<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>公司概覽 · Founder Desk</title>
<style>
.steps{display:flex;gap:8px;margin:20px 0 4px;flex-wrap:wrap}
.step{all:unset;box-sizing:border-box;cursor:pointer;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:7px;
  font-size:var(--fs-sub);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.step:hover{border-color:var(--text);color:var(--text)}
.step.on{border-color:var(--amber);color:var(--text)}
.step.done{border-color:rgba(153,215,188,.5);color:var(--mint)}
.step:focus-visible,.btn:focus-visible,.opt:focus-visible,.ed-val:focus-visible,.handle:focus-visible,.layer-toggle:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.notice{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--wait);border-radius:12px;padding:10px 14px;background:var(--panel);
  font-size:var(--fs-sub);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.ok{border-left-color:var(--mint)}
.layer-toggle{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;gap:12px;cursor:pointer;border-radius:7px}
.layer-toggle .lt-main{flex:1;min-width:0}
.layer-toggle .lt-sum{font-size:var(--fs-sub);color:var(--muted)}
.layer-toggle .chev{font-size:var(--fs-body);color:var(--amber);border:1px solid rgba(232,141,79,.45);border-radius:7px;height:30px;min-width:30px;display:grid;place-items:center;padding:0 8px}
.layer.closed .layer-toggle .chev{background:rgba(232,141,79,.08)}
.layer.closed .layer-toggle{flex-wrap:wrap;align-items:flex-end}
.layer.closed .lt-main{flex:1 1 380px}
.route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 6px;font-size:var(--fs-sub)}
.route .stop{border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--text);white-space:nowrap}
.route .stop.flag{border-color:var(--amber);color:var(--amber)}
.route .stop.deep{border-style:dashed;border-color:rgba(131,141,158,.8)}
.route .arrow{color:var(--muted)}
.pv{display:flex;flex-direction:column;gap:3px;margin:8px 0 4px;font-size:var(--fs-sub);color:var(--muted)}
.pv b{color:var(--text);font-weight:600}
.pv .eff{color:var(--red)}
.guide{color:var(--muted);font-size:var(--fs-sub);margin:10px 0 12px}
.tip{border:1px solid rgba(232,141,79,.26);border-left:3px solid var(--amber);border-radius:12px;padding:10px 14px;background:rgba(232,141,79,.045);margin:0 0 14px}
.tip .t-h{font-size:var(--fs-body);font-weight:600;margin:3px 0 2px}
.tip .t-w{font-size:var(--fs-sub);color:var(--muted);margin:0}
.alt{margin-top:8px;font-size:var(--fs-sub);color:var(--muted)}
.alt summary{cursor:pointer;color:var(--text);opacity:.9}
.alt p{margin:4px 0}
.tag.doc{border-color:rgba(156,163,179,.4);color:#c5cad5}
.tag.tent{border:1px dashed rgba(239,179,127,.75);color:var(--wait)}
.tag.miss{border:1px dashed rgba(242,162,158,.75);color:var(--red)}
.tag.deep{background:rgba(131,141,158,.12);color:var(--amber);border:1px dashed rgba(131,141,158,.75)}
.tag.flag{border-color:var(--amber);color:var(--amber);background:rgba(232,141,79,.08)}
.rows{display:flex;flex-direction:column}
.row{padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:4px}
.row-label{font-size:var(--fs-sub);color:var(--muted);margin-bottom:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-sub{font-size:var(--fs-sub);color:var(--wait);margin-top:4px}
.row-due{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sub);color:var(--muted);margin:2px 0 4px}
.row-due .ed{flex:1 1 auto}
.row-due .ed.compact .ed-val,.row-due .ed.compact .ed-val.edited{margin-left:0}
.p-date{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.p-date input[type=date]{font:var(--fs-sub) var(--ui);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:7px;height:32px;padding:0 8px}
.p-date input[type=date]:focus{outline:2px solid var(--mint);outline-offset:1px}
.ed{min-width:0}
.ed-val{all:unset;box-sizing:border-box;display:block;cursor:pointer;font-size:var(--fs-title);line-height:1.5;color:var(--text);border-radius:7px;
  padding:4px 8px;margin:0 -8px;border:1px solid transparent;word-break:break-word}
.ed-val:hover{border-color:var(--line);background:rgba(255,255,255,.025)}
.ed-val .pen{color:var(--muted);font-size:var(--fs-sub);margin-left:6px;opacity:.6}
.ed-val.empty{color:var(--red)}
.ed-val.edited{box-shadow:inset 3px 0 0 var(--mint);padding-left:11px}
.ed-val[aria-expanded="true"]{border-color:rgba(232,141,79,.5)}
.small .ed-val,.ed.small .ed-val{font-size:var(--fs-sub)}
.ed.compact{display:flex;flex-wrap:wrap;align-items:center;column-gap:8px;row-gap:2px}
.ed.compact .ed-val{display:inline-block;margin:0 0 0 -8px}
.ed.compact .ed-val.edited{margin-left:-11px}
.ed.compact .ed-meta{margin-top:0}
.ed.compact .panel{flex-basis:100%}
.st-facts .ed.compact .ed-val{padding-top:3px;padding-bottom:3px}
.ed-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:var(--fs-label);color:var(--muted)}
.ed-meta .orig{text-decoration:line-through;text-decoration-color:rgba(156,163,179,.5)}
.panel{margin-top:8px;border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:12px;padding:12px 14px;background:rgba(18,19,24,.96)}
.p-ask{font-size:var(--fs-body);font-weight:600;line-height:1.5}
.p-judge{font-size:var(--fs-sub);color:var(--muted)}
.p-why{font-size:var(--fs-sub);color:var(--muted);margin:6px 0 2px}
.p-why b{color:var(--text);font-weight:600;opacity:.85}
.opt .o-note{display:block;color:var(--muted);font-size:var(--fs-label)}
.p-free{margin-top:10px}
.p-lab{display:block;font-size:var(--fs-sub);color:var(--muted);margin-bottom:4px}
textarea,.note-in{width:100%;font:var(--fs-sub)/1.55 var(--mono);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{min-height:72px;resize:vertical}
textarea:focus,.note-in:focus{outline:2px solid var(--mint);outline-offset:1px}
.p-hint{font-size:var(--fs-label);color:var(--muted);margin-top:3px}
.p-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.status{margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.prepared{font-size:var(--fs-sub);margin:6px 0 4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prepared .ok{color:var(--mint)}
.st-list{display:flex;flex-direction:column;margin-top:6px}
.st-item{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;align-items:center;padding:7px 0;border-top:1px dashed rgba(255,255,255,.06)}
/* 狀態（唔可以撳）：實心色塊；動作（要撳）：方角框按鈕。兩者唔可以似 */
.q-ok{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;height:26px;padding:0 12px;border-radius:7px;border:1px solid var(--text);color:var(--text);background:rgba(255,255,255,.04);font-size:var(--fs-sub);font-weight:600;cursor:pointer;white-space:nowrap}
.q-ok:hover{background:rgba(153,215,188,.14);border-color:var(--mint);color:var(--mint)}
.q-ok:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.order-q{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1px dashed rgba(232,141,79,.45);border-radius:12px;font-size:var(--fs-sub)}
.prog-n{font-weight:600}
.lt-sum.q-left{color:var(--amber)}
.st-item:first-child{border-top:0}
.st-item .ed{display:contents}
.st-item .panel{grid-column:1/-1}
.st-item .ed-meta{grid-column:1/-1;justify-content:flex-end}
.st-text{font-size:var(--fs-body)}
.ed-val.pill{font-size:var(--fs-sub);padding:3px 10px;margin:0;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-align:center;white-space:nowrap}
.ed-val.pill.g-said{border-color:rgba(239,179,127,.7);color:var(--wait)}
.ed-val.pill.g-did{border-color:rgba(194,214,250,.7);color:var(--blue)}
.ed-val.pill.g-paid{border-color:rgba(153,215,188,.75);color:var(--mint)}
.ed-val.pill.edited{box-shadow:none;padding-left:10px;background:rgba(153,215,188,.06)}
.gaps{margin-top:12px;font-size:var(--fs-sub);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.map{position:relative;margin:4px 0 16px;padding:22px 6px 2px}
.map-cap{position:absolute;left:6px;top:0;font-size:var(--fs-min);color:var(--muted);letter-spacing:.04em}
.map-track{position:absolute;left:46px;right:46px;top:53px;border-top:2px dashed rgba(255,255,255,.13)}
.map-nodes{display:flex;justify-content:space-between;position:relative}
.node{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center}
.node .f{height:16px;font-size:var(--fs-min);color:var(--amber);white-space:nowrap}
.node .c{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--muted);display:grid;place-items:center;font:600 var(--fs-min) var(--mono);color:var(--muted);background:#0b0c10;margin-top:4px}
.node.flag .c{border-color:var(--amber);color:var(--amber)}
.node.beyond .c{border-style:dotted;opacity:.7}
.node .l{font-size:var(--fs-label);color:var(--muted);margin-top:6px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stations{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.station{position:relative;display:flex;gap:6px;background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 6px;
  transition:border-color .25s,box-shadow .25s,background .25s}
.station.flagged{border-left:3px solid var(--amber)}
.station.beyond{opacity:.86}
.station.dragging{z-index:5;border-color:var(--amber);background:#111319;box-shadow:0 14px 40px rgba(0,0,0,.6);transition:none}
body.is-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
.handle{all:unset;box-sizing:border-box;flex:none;width:30px;min-height:44px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;
  color:var(--muted);font-size:var(--fs-title);letter-spacing:-2px;border-radius:7px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.handle:hover{color:var(--text);background:rgba(255,255,255,.04)}
.st-main{flex:1;min-width:0}
.st-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.st-no{font:600 var(--fs-label) var(--mono);color:var(--amber);letter-spacing:.04em}
.st-short{font-weight:600;font-size:var(--fs-title)}
.st-badges{display:inline-flex;gap:6px;flex-wrap:wrap}
.st-facts{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline;margin-top:6px;font-size:var(--fs-sub)}
.st-facts .k{color:var(--muted);padding-top:5px}
.st-why{font-size:var(--fs-sub);color:var(--muted);margin:8px 0 6px}
.st-why b{color:var(--text);opacity:.8;font-weight:600}
.moved{color:var(--wait)}
.st-detail{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.four{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.four .k,.whys .q,.watch .k{font-size:var(--fs-label);color:var(--muted)}
.d-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-sub);font-weight:600;margin:14px 0 4px}
.whys{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.whys .test{font-size:var(--fs-label);color:var(--muted);margin-top:2px}
.watch{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sub)}
.sub{margin-top:18px}
.sub h3{font-size:var(--fs-sub);font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub .p-judge{margin:-2px 0 6px}
.miss-item,.kv{padding:9px 0;border-top:1px dashed rgba(255,255,255,.07)}
.miss-item:first-of-type,.kv:first-of-type{border-top:0}
.m-title,.kv .k{font-size:var(--fs-sub);color:var(--muted)}
.m-how{font-size:var(--fs-label);color:var(--muted);margin-top:2px}
.lens-why{font-size:var(--fs-sub);color:var(--muted);margin:4px 0 0}
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.box{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box h4{margin:0 0 4px;font-size:var(--fs-sub)}
.box ul{margin:0;padding-left:16px;font-size:var(--fs-sub);color:var(--muted)}
.box.ask{border-color:rgba(242,162,158,.35)}
.srcs{margin:0;padding-left:16px;font-size:var(--fs-sub);color:var(--muted)}
.srcs b{color:var(--text);font-weight:600}
.foot{margin:22px 0 0;font-size:var(--fs-label);color:var(--muted);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.foot-tools{display:flex;gap:8px;flex-wrap:wrap}
.st-main > .btn.small{height:auto;min-height:26px;white-space:normal;text-align:left;padding:4px 10px}
.cbar-txt{font-size:var(--fs-sub);color:var(--muted)}
.cbar-txt b{color:var(--text);font-weight:600}
.m-head p{margin:0;font-size:var(--fs-sub);color:var(--muted)}
.m-sec{margin-top:12px}
.m-sec h4{margin:0 0 4px;font-size:var(--fs-sub);display:flex;gap:8px;align-items:center}
.m-sec ul,.m-sec ol{margin:0;padding-left:18px;font-size:var(--fs-sub)}
.m-sec li{margin:2px 0}
.effect{border:1px solid rgba(232,141,79,.35);border-left:3px solid var(--amber);border-radius:12px;padding:10px 14px;background:rgba(232,141,79,.04)}
.warn{border:1px solid rgba(239,179,127,.4);border-radius:12px;padding:10px 14px;font-size:var(--fs-sub);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.chg .was{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(156,163,179,.5)}
.chg .now{color:var(--mint)}
.copybox{margin-top:8px}
.copybox textarea{min-height:120px}
.decide{margin-top:18px}
.dq-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dq > .p-judge{margin:4px 0 2px 32px}
.dq > .opt,.dq > .chips,.dq > .grade-row,.dq > .dq-foot,.dq > .prepared,.dq > .dq-custom,.dq > .p-free{margin-left:32px}
.dq > .opt{width:calc(100% - 32px)}
.dq-custom{font-size:var(--fs-sub);margin-top:8px}
.dq > .prepared{display:block;font-size:var(--fs-sub);color:var(--muted)}
.dq > .prepared .ok{margin-right:6px}
.dq-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip:focus-visible,.seg:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.grade-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:var(--fs-sub)}
.gr-l{color:var(--muted)}
.seg{all:unset;box-sizing:border-box;cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:7px;font-size:var(--fs-sub)}
.seg.on{border-color:var(--mint);color:var(--mint);background:rgba(153,215,188,.08)}
.rs-line{display:block}
.rs-line .route{display:inline-flex;margin:0 0 0 4px;vertical-align:middle}
.rest .eff{color:var(--red)}
.tent-line{color:var(--wait)}
.m-rest{margin:10px 0 0}
.tr-result{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.tr-result h4{margin:10px 0 4px;font-size:var(--fs-sub)}
.tr-result ul{margin:0;padding-left:18px}
.tr-result details{border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin-top:6px;background:rgba(255,255,255,.015)}
.tr-result summary{cursor:pointer;font-weight:600}
.tr-result pre{white-space:pre-wrap;word-break:break-word;font:var(--fs-sub)/1.65 var(--ui);margin:8px 0 2px;color:var(--text)}
.tr-live{color:var(--amber)}
.asks-next{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.asks-next a{text-decoration:none}
.fatal p{margin:6px 0}
@media (max-width:600px){
  .steps{gap:6px}
  .step{flex:1 1 0;justify-content:center;height:36px;padding:0 6px;font-size:var(--fs-label)}
  .p-date input[type=date]{height:44px;flex:1 1 160px;font-size:var(--fs-title)}
  .q-ok{height:36px;padding:0 14px;font-size:var(--fs-sub)}
  .st-item{grid-template-columns:1fr auto;}
  .st-item .q-ok{grid-column:2}
  .dq > .p-judge,.dq > .opt,.dq > .chips,.dq > .grade-row,.dq > .dq-foot,.dq > .prepared,.dq > .dq-custom,.dq > .p-free{margin-left:0}
  .dq > .opt{width:100%}
  .seg{padding:9px 12px;font-size:var(--fs-sub)}
  .cbar-in .prog-top .btn.small{width:auto;height:34px;margin-left:auto;flex:none}
  .prog-top .cbar-txt{display:none}
  .ed-val{padding:8px 8px}
  .ed-val.pill{padding:8px 12px}
  .map{display:none}
  .station{padding:12px 12px 12px 4px}
  .handle{width:36px;font-size:var(--fs-title)}
  .four{grid-template-columns:1fr}
  .boxes{grid-template-columns:1fr}
  .cbar-in .btn{width:100%}
  .m-foot .btn{flex:1 1 30%}
}
</style>

    <span class="eyebrow">載入中……</span>
    <p class="guide">如畫面一直停留於此，表示此視窗未有執行網頁程式（例如應用程式內的預覽）。請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」，再於該處打開公司概覽。</p>

<script>
(function () {
  'use strict';
  var DEFAULT_DATA = 'company-page.js';

  // 證據級：key 係資料值（none／said／did／paid，唔改）；畫面只顯示 names.js 嘅名稱（ev_）同解釋（evd_），唔顯示級數
  var EV = window.SOS_NAMES.dash;
  var GRADES = [['none', 0], ['said', 1], ['did', 2], ['paid', 3]].map(function (g) { return { key: g[0], text: EV['ev_' + g[1]], hint: EV['evd_' + g[1]] }; });
  var DEPTH_Q = ['對方為何會同意？', '對方如何決定、需時多久？', '需要先具備甚麼條件？', '最常見的失敗原因是甚麼？', '為何定於這個日期／數字？'];
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var N = window.SOS_NAMES, T = N.t, DESK = window.SOS_DESK;
  var D = null, REG = {}, SRC = {}, S = null, HASH = '', FLAGFIELD = null;

  /* ---------- 小工具 ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }

      h('h3', null, state === 'done' ? N.ui.trackDone : state === 'failed' ? N.ui.trackFailed : state === 'waiting' ? N.ui.aiNotSet : N.ui.trackRunning),
      h('ol', { class: 'tr-steps' }, rows.map(function (x) {
        var ic = x.state === 'done' ? '✓' : x.state === 'failed' ? '✕' : x.state === 'running' ? '…' : '○';
        return h('li', null, h('span', { class: 'tr-ic ' + x.state }, ic),
          h('span', null, x.label, x.sub ? h('span', { class: 'tr-sub' }, x.sub) : null));
      })));
    if (state === 'waiting') card.append(h('p', null, (ai && ai.detail) || 'AI 尚未設定，設定完成後將自動繼續。'), h('div', { class: 'p-foot' }, h('a', { class: 'btn primary', href: '/#/setup' }, N.ui.goSetup)));
    if (S.lost) card.append(h('p', { class: 'tr-sub' }, 'Founder Desk 已停止。請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」，即可繼續；已收到的確認不會遺失。'));
    if (state === 'failed') {
      add(card, [(ai && ai.detail === r.error) ? null : h('p', null, '原因：' + (r.error || '未知')),
        failedStep(r) === 'applied'
          ? h('button', { type: 'button', class: 'btn primary', onclick: function () { location.reload(); } }, '重新載入頁面，再確認一次')
          : [ready ? null : h('p', { class: 'tr-sub' }, '請先安裝並登入 AI 工具（' + aiName + '），再按「' + N.ui.retry + '」。'),
            h('button', { type: 'button', class: 'btn primary', onclick: retryRun }, N.ui.retry)]]);
    }
    if (state === 'done' && r.result) {
      var res = r.result, box = h('div', { class: 'tr-result' });
      box.append(h('p', null, N.fix(res.summary)));
      if (res.styleWarnings && res.styleWarnings.length) box.append(h('p', { class: 'tr-sub' }, N.ui.styleNote + '：有 ' + res.styleWarnings.length + ' 處用字未能自動修正（' +
        res.styleWarnings.slice(0, 4).map(function (w) { return w.where + '：' + w.term; }).join('；') + (res.styleWarnings.length > 4 ? '……' : '') + '）'));
      if (res.artifacts.length) box.append(h('h4', null, N.ui.aiOutputs));
      res.artifacts.forEach(function (a, i) {
        var d = h('details', null, h('summary', null, a.title), window.SOS_MD ? SOS_MD(a.text) : h('pre', null, a.text));
        if (i === 0) d.open = true;
        box.append(d);
      });
      if (res.founderNext && res.founderNext.length) box.append(h('h4', null, N.ui.yourNext), h('ul', null, res.founderNext.map(function (x) { return h('li', null, x); })));
      if (res.needsYourDecision && res.needsYourDecision.length) box.append(h('h4', null, N.ui.pending), h('ul', null, res.needsYourDecision.map(function (x) { return h('li', null, x); })));
      box.append(h('p', { class: 'tr-sub' }, '以上全部為草稿，AI 未有對外發送任何內容。'));
      if (res.asks && res.asks.length) {
        box.append(h('div', { class: 'asks-next' },
          h('b', null, T('aiFollowAskN', { n: res.asks.reduce(function (n, a) { return n + a.count; }, 0) }) + '：'),
          res.asks.map(function (a) { return h('a', { class: 'btn primary', href: '/#/ask/' + encodeURIComponent(a.id) }, N.fix(a.title) + ' → ' + N.ui.goAnswer); })));
      }
      card.append(box);
    }
    root.append(card);
  }

  /* ---------- 回覆檔 ---------- */
  function buildReply(now) {
    var ms = byId(), fm = flagged(), oc = orderChanged(), pr = proposed();
    var edits = Object.keys(S.edits).filter(function (id) { return REG[id]; }).map(function (id) {
      var e = REG[id];
      return { id: id, plan: e.plan || null, label: e.label, ai: showVal(e, String(e.value == null ? '' : e.value)), founder: showVal(e, S.edits[id]), value: S.edits[id] };
    });
    var kept = all().filter(function (e) { return !isEdited(e.id); });
    var tentKept = kept.filter(function (e) { return e.tentative; });
    var missing = missingList();
    var effects = ((D.detail && D.detail.rules) || []).filter(function (r) { return r.effect; });
    var L = [];
    L.push('# 確認回覆：' + D.company.name + ' ' + N.ui.company, '');
    L.push('確認時間：' + human(now));
    L.push('結果：' + (edits.length || oc ? '已確認（你修改了 ' + edits.length + ' 項' + (oc ? '，並調整了次序' : '') + '）' : '已確認，全部採用 AI 建議'), '');
    L.push('## ' + N.ui.nowAfter);
    L.push('- 開局答案：目標、目前進度、下一個對外動作、負責人');
    L.push('- ' + N.ui.route + '次序' + (oc ? '（' + N.ui.changed + '）' : '（' + N.ui.adopted + '）') + '：');
    S.order.forEach(function (mid, i) {
      var pi = pr.indexOf(mid);
      L.push('  ' + (i + 1) + '. ' + ms[mid].short + (pi !== i ? '（AI 原本排第 ' + (pi + 1) + '）' : '') + (fm && fm.id === mid ? '　⚑ 下一個對外動作' : ''));
    });
    effects.forEach(function (r) { L.push('- ' + r.label + '：' + cur(r.id) + (isEdited(r.id) ? '（你已修改）' : '')); });
    L.push('', '## 每站是' + N.ui.kindReal + '還是' + N.ui.kindTask);
    S.order.forEach(function (mid, i) { var k = kindOf(ms[mid]); L.push('- ' + (i + 1) + '. ' + ms[mid].short + '：' + kindName(k) + (kindChanged().indexOf(mid) >= 0 ? '（你已修改）' : '（' + N.ui.adopted + '）')); });
    L.push('', '## 你修改的項目（' + edits.length + ' 項）');
    if (!edits.length) L.push('- 沒有');
    edits.forEach(function (x) { L.push('- ' + x.label, '  - AI：' + (x.ai || N.ui.fillShort), '  - 你：' + x.founder); });
    L.push('', '## 其餘採用 AI 建議');
    L.push('- 當中 ' + tentKept.length + ' 項為「' + N.ui.tentative + '」' + (D.page.nextAskOn ? '，' + md(D.page.nextAskOn) + '再詢問你' : ''));
    if (missing.length) L.push('- ' + missing.length + ' 項尚未有答案：' + missing.map(function (e) { return e.label; }).join('；') + '。AI 會開設一項工作尋找答案，找到後再詢問你。');
    L.push('');
    if (S.note.trim()) L.push('## 你的備註', S.note.trim(), '');
    var machine = {
      format: 'startup-os.proofread-reply/0.1',
      page: D.page.id, company: D.company.name, confirmedAt: localIso(now),
      confirm: ['intake', 'order'].concat(effects.map(function (r) { return r.plan || r.id; })),
      order: S.order, orderProposed: pr, orderChanged: oc,
      nextActionMilestone: fm ? fm.id : null,
      // 「要你決定」嗰幾條你有冇答（而家去到邊展開做每一項），寫入紀錄用
      decided: QIDS.reduce(function (list, id) {
        if (id === '@status') statusItems().forEach(function (it) { list.push({ id: it.id, answered: answered('@status') }); });
        else list.push({ id: id, answered: answered(id) });
        return list;
      }, []),
      edits: edits,
      keptAsAI: kept.map(function (e) { return e.id; }),
      tentativeKept: tentKept.map(function (e) { return { id: e.id, until: e.tentative.until }; }),
      stillMissing: missing.map(function (e) { return e.id; }),
      kinds: (function () { var o = {}; S.order.forEach(function (mid) { o[mid] = kindOf(byId()[mid]); }); return o; })(), kindsChanged: kindChanged(),
      note: S.note.trim()
    };
    L.push('## 機器讀取部分（供 AI 系統使用，毋須查閱）', '```json', JSON.stringify(machine, null, 2), '```');
    var head = ['kind: proofread', 'ref: ' + D.page.id, 'option: ' + (edits.length || oc || kindChanged().length ? 'confirm-with-edits' : 'confirm'),
      'rev: ' + (D.page.revision || 0), 'hash: ' + HASH, 'batch: false', 'shownAt: ' + localIso(S.shownAt)];
    return {
      text: head.join('\n') + '\n\n' + L.join('\n') + '\n',
      name: stamp(now) + '-proofread-' + safeName(D.page.id) + '.md',
      edits: edits, kept: kept, tentKept: tentKept, missing: missing, oc: oc, effects: effects, fm: fm
    };
  }

  var lastFocus = null;
  function closeModal() {
    var root = $('#modal-root');
    if (!root.firstChild) return;
    root.replaceChildren();
    document.removeEventListener('keydown', modalKeys, true);
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
  }
  function modalKeys(ev) {
    var dlg = $('#modal-root .modal');
    if (!dlg) return;
    if (ev.key === 'Escape') { ev.preventDefault(); closeModal(); return; }
    if (ev.key === 'Tab') {
      var f = dlg.querySelectorAll('button,input,textarea,summary,[tabindex]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
      return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey) {
      var t = ev.target;
      if (t.tagName === 'TEXTAREA' || t.tagName === 'BUTTON' || t.tagName === 'SUMMARY') return;
      ev.preventDefault(); $('#do-confirm').click();
    }
  }
  function openModal() {
    if (!D) return;
    lastFocus = document.activeElement;
    S.open = null;
    var now = new Date(), R = buildReply(now), ms = byId(), pr = proposed();
    var pre = h('pre', { class: 'file' }, R.text);
    var note = h('input', { class: 'note-in', type: 'text', placeholder: '需要補充一句？（可留空）', 'aria-label': '備註', value: S.note });
    note.addEventListener('input', function () { S.note = note.value; save(); R = buildReply(now); pre.textContent = R.text; });
    var copyHolder = h('div', { class: 'copybox' });
    var body = h('div', { class: 'm-body' });
    var online = !!S.server;
    if (!online) {
      body.append(h('div', { class: 'warn' },
        h('span', null, '未連接 AI：此次確認只會下載為檔案，AI 不會收到。請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」，再於該處打開公司概覽並確認，AI 才會自動跟進。')));
    }
    // 預覽只講四件事：下一步、目標、路線、AI 權限；其餘收埋
    var g5 = FLAGFIELD, g1id = byPlan('G1') || (D.glance.rows[0] && D.glance.rows[0].id), g1 = g1id && REG[g1id];
    var g1row = D.glance.rows.filter(function (r) { return r.id === g1id; })[0];
    var sum = h('ul', { class: 'm-sum' },
      g5 ? h('li', null, h('b', null, N.ui.nextStep + '：'), cur(g5.id), h('span', { class: 'tr-sub' }, 'AI 將隨即準備草稿，不會對外發送')) : null,
      g1 && (!g5 || g1id !== g5.id) ? h('li', null, h('b', null, g1.label + '：'), cur(g1id),
        g1row && g1row.due ? '（期限 ' + showVal(REG[g1row.due.id], cur(g1row.due.id)) + '）' : '') : null,
      h('li', null, h('b', null, N.ui.routeName + '：'), S.order.map(function (mid, i) { return (i + 1) + ' ' + ms[mid].short; }).join(' → '), R.oc ? '（' + N.ui.changed + '）' : ''),
      R.effects.map(function (r) {
        return h('li', null, h('b', null, r.label + '：'), cur(r.id),
          r.boxes && r.boxes.askFirst ? h('span', { class: 'tr-sub' }, '必須先詢問你：' + r.boxes.askFirst.slice(0, 3).join('、') + ' 等') : null);
      }));
    body.append(h('div', { class: 'm-sec effect' }, h('h4', null, N.ui.nowAfter), sum));
    var qs = qStats();
    body.append(h('p', { class: 'p-judge m-rest' },
      (R.edits.length ? '你修改了 ' + R.edits.length + ' 項；' : '') + (kindChanged().length ? '你改了 ' + kindChanged().length + ' 站的' + N.ui.kindReal + '／' + N.ui.kindTask + '判斷；' : '') +
      (qs.left ? '未作答的 ' + qs.left + ' 條按 AI 建議；' : '') +
      '其餘採用 AI 建議' + (R.tentKept.length && D.page.nextAskOn ? '，「' + N.ui.tentative + '」項目由 ' + md(D.page.nextAskOn) + ' 起分批再詢問你' : '') + '。'));
    var changes = R.edits.length ? h('ul', { class: 'chg' }, R.edits.map(function (x) {
      return h('li', null, x.label + '：', h('span', { class: 'was' }, clip(x.ai || N.ui.fillShort, 40)), ' → ', h('span', { class: 'now' }, x.founder));
    })) : h('p', { class: 'p-judge' }, '未作修改，全部採用 AI 建議。');
    body.append(h('details', { class: 'm-sec' }, h('summary', null, N.ui.reviewMore),
      h('h4', null, N.ui.changedItems), changes, h('div', { class: 'm-sec' }, note), pre));
    body.append(copyHolder);
    function doCopy() {
      var text = R.text;
      var fallback = function () {
        var ta = h('textarea', { readonly: true, 'aria-label': '回覆文字' }); ta.value = text;
        copyHolder.replaceChildren(h('p', { class: 'p-judge' }, '瀏覽器不允許自動複製：文字已全部選取，請按 Ctrl + C（手機請長按）複製。'), ta);
        ta.focus(); ta.select();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('已複製回覆文字'); }, fallback);
      } else fallback();
    }
    function doConfirm() {
      var ok = true;
      try {
        var blob = new Blob([R.text], { type: 'text/markdown;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = h('a', { href: url, download: R.name });
        document.body.append(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      } catch (e) { ok = false; }
      if (!ok) { doCopy(); return; }
      S.confirmed = { at: human(now), name: R.name };
      S.restored = false; S.changedAfter = false; save();
      closeModal(); render(); window.scrollTo(0, 0);
      toast('已確認，回覆檔已下載至瀏覽器的下載資料夾。');
    }
    var btnMain = h('button', { type: 'button', class: 'btn primary', id: 'do-confirm', onclick: online ? doSend : doConfirm },
      online ? '★ ' + N.ui.submit : N.ui.downloadOffline);
    function doSend() {
      btnMain.disabled = true; btnMain.textContent = N.ui.sending;
      fetch('/api/submit', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind: 'proofread', ref: D.page.id, text: R.text })
      })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || String(r.status)); return j; }); })
        .then(function (j) {
          S.sent = { name: j.file, at: j.receivedAt };
          S.server.pending = (S.server.pending || []).concat([j.file]);
          S.confirmed = { at: human(now), name: j.file, sent: true };
          S.restored = false; S.changedAfter = false; save();
          closeModal(); render(); window.scrollTo(0, 0); poll();
          toast(N.ui.sent);
        })
        .catch(function (e) {
          btnMain.disabled = false; btnMain.textContent = N.ui.resend;
          copyHolder.replaceChildren(h('p', { class: 'p-judge' }, '未能送出（' + e.message + '）。Founder Desk 可能已停止：請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」重新開啟，然後再按送出。'));
        });
    }
    var dlg = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mt' },
      h('div', { class: 'm-head' }, h('span', { class: 'eyebrow' }, N.ui.replyBox), h('h3', { id: 'mt' }, online ? N.ui.submit : N.ui.confirmOnly),
        h('p', null, online
          ? '按確認後即交予 AI，AI 將自動跟進。'
          : '')),
      body,
      h('div', { class: 'm-foot' },
        h('button', { type: 'button', class: 'btn', onclick: closeModal }, N.ui.back),
        online ? null : h('button', { type: 'button', class: 'btn', onclick: doCopy }, '複製文字'),
        btnMain));
    var back = h('div', { class: 'backdrop', onclick: function (ev) { if (ev.target === back) closeModal(); } }, dlg);
    $('#modal-root').replaceChildren(back);
    document.addEventListener('keydown', modalKeys, true);
    $('#do-confirm').focus();
  }

  loadData();
})();
</script>
</body>
</html>
