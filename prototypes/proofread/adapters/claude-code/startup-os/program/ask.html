<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Founder Desk</title>
<style>
.sub{color:var(--muted);margin:2px 0 0;font-size:var(--fs-body)}
.guide{color:var(--muted);font-size:var(--fs-sub);margin:8px 0 0}
.layer.accent{border-left:3px solid var(--amber)}
.layer.accent.ok{border-left-color:var(--mint)}
/* 陶土 AI 團隊場景圖：文字在左、圖在右；靜止、無邊框；手機闊度不顯示（品牌角色規格第 7 節） */
.with-scene{isolation:isolate;overflow:hidden;min-height:240px;display:flex;flex-direction:column;justify-content:center}
.scene-bg{position:absolute;top:0;bottom:0;right:0;width:43.5%;z-index:-1;border-radius:0 var(--r-card) var(--r-card) 0;background-repeat:no-repeat;background-size:cover;background-position:center 30%;opacity:.6;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 40%);mask-image:linear-gradient(90deg,transparent 0%,#000 40%)}
.layer > .eyebrow + .row{margin-top:4px}
.hero-meta{font-size:var(--fs-sub);color:var(--muted);margin:0 0 14px}
.pack-t{font-size:var(--fs-page);font-weight:650;margin:18px 0 0;line-height:1.35}
.rest-list{margin-top:8px}
.adopted{color:var(--muted);font-size:var(--fs-sub)}
details.layer summary{cursor:pointer;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sub)}
.dq-body{margin-left:32px}
.why{font-size:var(--fs-sub);color:var(--muted);margin:4px 0 2px}
.o-note{display:block;color:var(--muted);font-size:var(--fs-label)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
textarea,.in{width:100%;font:var(--fs-sub)/1.55 var(--ui);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
textarea{min-height:64px;resize:vertical}
input[type=date]{font:var(--fs-sub) var(--ui);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:7px;height:32px;padding:0 8px}
.custom{font-size:var(--fs-sub);margin-top:8px}
.rest-line{display:block;font-size:var(--fs-sub);color:var(--muted);margin:3px 0}
.rest-line b{color:var(--text);font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:600;font-size:var(--fs-title)}
.empty{color:var(--muted);font-size:var(--fs-sub)}
.log-day{font:600 var(--fs-sub) var(--mono);color:var(--amber);margin:18px 0 4px;letter-spacing:.04em}
.log-item{margin-top:10px;border-left:3px solid var(--line)}
.layer.block{border-left:3px solid var(--red)}
.tr-ic.waiting{border-color:var(--red);color:var(--red)}
.tr-fix{display:block;font-size:var(--fs-sub);color:var(--wait);margin-top:2px}
.iq{margin-top:14px}
.iq-q{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:var(--fs-body);margin-bottom:2px}
.iq-hint{font-size:var(--fs-sub);color:var(--muted);margin:0 0 6px}
.iq-sec{font-size:var(--fs-sub);color:var(--muted);margin:20px 0 0;font-weight:600}
details.iq-opt{margin-top:18px}
details.iq-opt summary{cursor:pointer;font-weight:600}
.pf-box{margin-top:12px}.pf-go{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pf-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}.pf-row:empty{display:none}.pf-offer{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 10px;border:1px dashed var(--amber);border-radius:8px}
.drop{margin-top:8px;border:1px dashed rgba(255,255,255,.28);border-radius:12px;padding:16px;text-align:center}
.drop.over{border-color:var(--amber);background:rgba(232,141,79,.06)}
.drop p{margin:4px 0 10px}
.file-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:var(--fs-sub)}
.file-row span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
#intake-err{color:var(--red);margin-top:6px}
.desk-foot{margin:22px 0 0;text-align:right;font-size:var(--fs-sub)}
.desk-foot a{color:var(--muted)}
.note-line{font-size:var(--fs-sub);color:var(--muted);margin:8px 0 0}
.log-item.chg{border-left-color:var(--mint)}
.qa{margin:8px 0 0;padding:0;list-style:none}
.qa li{padding:6px 0;border-top:1px dashed rgba(255,255,255,.07);font-size:var(--fs-sub)}
.qa li:first-child{border-top:0}
.qa .q{font-weight:600}
.qa .a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.qa .ai{color:var(--muted);font-size:var(--fs-sub)}
.logf{display:flex;gap:6px;margin-top:12px}
.logf .btn.on{border-color:var(--mint);color:var(--mint)}
.result{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.result h4{margin:10px 0 4px;font-size:var(--fs-sub)}
.result ul{margin:0;padding-left:18px}
details.art{border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin-top:6px;background:rgba(255,255,255,.015)}
details.art summary{cursor:pointer;font-weight:600}
details.art pre{white-space:pre-wrap;word-break:break-word;font:var(--fs-sub)/1.65 var(--ui);margin:8px 0 2px}
.effect{border:1px solid rgba(232,141,79,.35);border-left:3px solid var(--amber);border-radius:12px;padding:10px 14px;background:rgba(232,141,79,.04);margin-top:10px}
.effect h4{margin:0 0 4px;font-size:var(--fs-sub)}
/* 情景演練 */
.pr-tag{display:inline-block;font-size:var(--fs-label);color:var(--wait);border:1px dashed rgba(239,179,127,.55);border-radius:6px;padding:1px 8px}
.pcard{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:var(--fs-sub);margin-top:8px}
.pcard dt{color:var(--muted)}
.pcard dd{margin:0;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.pcard dd span.v{flex:1 1 220px;min-width:0}
.pcard input{width:100%;font:var(--fs-sub) var(--ui);color:var(--text);background:rgba(0,0,0,.28);border:1px solid var(--amber);border-radius:7px;padding:6px 8px}
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.plist{margin:6px 0 0;padding-left:20px;font-size:var(--fs-sub)}
.plist li{margin:3px 0}
.plist .resp{display:block;color:var(--muted);font-size:var(--fs-sub)}
.pl-top{position:sticky;top:0;z-index:15;background:rgba(9,10,14,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0 8px;margin:0 0 8px}
.pl-who{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pl-who b{font-size:var(--fs-title)}
.pl-who small{display:block;color:var(--muted);font-size:var(--fs-sub)}
.mood{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sub);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.mood i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.mood[data-s="-2"] i,.mood[data-s="-1"] i{background:var(--red)}
.mood[data-s="1"] i,.mood[data-s="2"] i{background:var(--mint)}
.trk{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trk span{font-size:var(--fs-label);border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.trk span b{color:var(--text);font-weight:600}
.trk span.ok{border-color:rgba(153,215,188,.55);color:var(--mint)}
.trk .gdots{letter-spacing:2px}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:230px}
.bub{max-width:82%;padding:10px 14px;border-radius:14px;font-size:var(--fs-body);line-height:1.55;position:relative}
.bub.them{align-self:flex-start;background:#171a21;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.you{align-self:flex-end;background:rgba(232,141,79,.12);border:1px solid rgba(232,141,79,.35);border-bottom-right-radius:4px}
.bub small{display:block;font-size:var(--fs-label);color:var(--muted);margin-top:4px}
.bub.typing{color:var(--muted)}
.bub.typing:after{content:"…";animation:blink 1.2s infinite}
.pbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,10,14,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pbar-in{max-width:880px;margin:0 auto;padding:10px 42px 12px}
.sugs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sug{display:flex;gap:6px;align-items:stretch}
.sug .say{all:unset;box-sizing:border-box;flex:1;cursor:pointer;font-size:var(--fs-sub);line-height:1.45;padding:8px 12px;border:1px solid rgba(232,141,79,.45);border-radius:9px;background:rgba(232,141,79,.06)}
.sug .say:hover{border-color:var(--amber)}
.sug .say:focus-visible{outline:2px solid var(--mint)}
.sug .btn{height:auto}
.pin{display:flex;gap:8px;align-items:flex-end}
.pin textarea{min-height:44px;flex:1}
.pact{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hintbox{border:1px dashed rgba(153,215,188,.5);border-radius:9px;padding:8px 12px;font-size:var(--fs-sub);margin-bottom:8px;color:#d9fff2}
.rv h4{margin:14px 0 6px;font-size:var(--fs-body)}
.rv .ok{color:var(--mint)}.rv .mid{color:var(--wait)}.rv .bad{color:var(--red)}
.mcard{max-width:520px;margin:12px auto 0;border:1px solid rgba(232,141,79,.45);border-radius:16px;padding:18px 20px;background:linear-gradient(180deg,rgba(232,141,79,.08),rgba(14,15,19,.95) 60%)}
.mcard h3{margin:0 0 4px;font-size:var(--fs-title)}
.mcard .sec{margin-top:14px}
.mcard .sec b{display:block;font-size:var(--fs-sub);color:var(--amber);letter-spacing:.06em;margin-bottom:4px}
.mcard p,.mcard li{font-size:var(--fs-title);line-height:1.55;margin:4px 0}
.mcard ul{padding-left:20px;margin:0}
@media (max-width:600px){
  .pcard{grid-template-columns:1fr;gap:2px}
  .pcard dt{margin-top:8px}
  .bub{max-width:92%}
  .pbar-in{padding:8px 12px 10px}
  .chat{padding-bottom:280px}
  .mcard p,.mcard li{font-size:var(--fs-title)}
}
@media (max-width:600px){
  .dq-body{margin-left:0}
  .with-scene{min-height:0}
  .with-scene{min-height:0}
  .scene-bg{width:100%;opacity:.2;-webkit-mask-image:none;mask-image:none}
  input[type=date]{height:44px;font-size:var(--fs-title)}
  .cbar-in > .btn{width:100%}
  .prog-top .btn{height:34px;margin-left:auto}
  .m-foot .btn{flex:1 1 40%}
}
</style>

<body>
<div class="shell" id="app">
  <div class="layer"><span class="eyebrow">載入中……</span>
    <p class="guide">如畫面一直停留於此，表示 Founder Desk 尚未開啟。請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」，即可重新開啟此頁。</p></div>
</div>
<div class="cbar" id="cbar" hidden></div>
<div id="modal-root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
<script src="md.js"></script>
<script>
(function () {
  'use strict';
  var N = window.SOS_NAMES, T = N.t, DESK = window.SOS_DESK;
  /* ---------- 小工具（同公司概覽一樣） ---------- */
  var REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(s, r) { return (r || document).querySelector(s); }
  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) for (var k in props) {
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, c) {
    if (c == null || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  function setApp() {
    // 用 add() 填：陣列會拆開、冇嘢唔會變成字
    var app = $('#app'); app.replaceChildren();
    for (var i = 0; i < arguments.length; i++) add(app, arguments[i]);
  }
  function tag(t, k) { return h('span', { class: 'tag ' + (k || '') }, t); }
  function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function pad(n) { return String(n).padStart(2, '0'); }
  var WD = ['日', '一', '二', '三', '四', '五', '六'];
  function parseDay(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function isoDay(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function quarterEnd(d) { return new Date(d.getFullYear(), Math.floor(d.getMonth() / 3) * 3 + 3, 0); }
  function fmtDay(s) {
    var d = parseDay(s); if (!d) return String(s || '');
    return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + ' 年 ' : '') + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日（' + WD[d.getDay()] + '）';
  }
  function localIso(d) {
    var off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-', a = Math.abs(off);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()) + sign + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
  }
  function hm(iso) { var m = /T(\d{2}:\d{2})/.exec(String(iso || '')); return m ? m[1] : ''; }
  function dayOf(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || '')); return m ? (+m[2]) + ' 月 ' + (+m[3]) + ' 日' : ''; }
  function fnv(str) { var x = 0x811c9dc5; for (var i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 0x01000193) >>> 0; } return ('0000000' + x.toString(16)).slice(-8); }
  var toastTimer = null;
  function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.hidden = true; }, 4000); }
  function announce(t) { var l = $('#live'); l.textContent = ''; setTimeout(function () { l.textContent = t; }, 30); }
  function get(url) { return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); }); }
  function post(url, body) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.error || String(r.status)); return j; }); });
  }
  function head(page, st) { return DESK.header({ page: page, company: st && st.company, pending: st ? st.openAsks : 0, sim: !!(st && st.sim) }); }
  function showAns(q, v) { return Array.isArray(v) ? v.join('、') : (q && q.kind === 'date' ? fmtDay(v) : String(v == null ? '' : v)); }

  /* ---------- 伺服器重新開過：頁面可能過時 ---------- */
  function checkInstance(st) {
    if (!st || !st.instance) return;
    if (!V.instance) { V.instance = st.instance; return; }
    if (st.instance === V.instance || $('#stale')) return;
    var bar = h('div', { class: 'track off', id: 'stale' }, h('b', null, N.ui.staleTitle + '：'), '此頁可能已過時，請重新載入後再繼續。 ',
      h('button', { type: 'button', class: 'btn primary', onclick: function () { location.reload(); } }, N.ui.reload));
    var app = $('#app'); app.insertBefore(bar, app.firstChild);
  }
  /* ---------- 路由 ---------- */
  var V = { status: null, pollTimer: null };
  function route() {
    clearTimeout(V.pollTimer);
    $('#cbar').hidden = true;
    closeModal();
    var m = /^#\/ask\/([\w-]{1,80})$/.exec(location.hash);
    if (m) return showAsk(m[1]);
    if (location.hash === '#/log') return showLog();
    if (location.hash === '#/setup') return showSetup();
    if (location.hash === '#/intake') return showIntake();
    var pm = /^#\/practice(?:\/(new|s|card|debrief)\/([\w-]{1,60})|\/([\w-]{1,60}))?$/.exec(location.hash);
    if (pm) { $('#cbar').hidden = true; return pm[1] === 'new' ? showPracticeNew(pm[2]) : pm[1] === 's' ? showPracticeSession(pm[2]) : pm[1] === 'card' ? showPracticeCard(pm[2]) : pm[1] === 'debrief' ? showDebrief(pm[2]) : pm[3] ? showPracticePrep(pm[3]) : showPracticeList(); }
    var dm = /^#\/debate(?:\/new(?:\/(\w+)(?:\/([\w-]{1,40}))?)?|\/([\w-]{1,40}))?$/.exec(location.hash);
    if (dm) return /^#\/debate\/new/.test(location.hash) ? showDebateNew(dm[1], dm[2]) : dm[3] ? showDebateMatch(dm[3]) : showDebateList();
    var rq = /^#\/request\/(order|adhoc|event)$/.exec(location.hash);
    if (rq) return showRequest(rq[1]);
    return showHub();
  }
  function fail(msg) {
    setApp(DESK.nav('pending', 0), h('div', { class: 'layer' }, h('span', { class: 'eyebrow' }, N.ui.offline), h('p', null, msg),
      h('p', { class: 'guide' }, 'Founder Desk 尚未開啟：請在 Claude 輸入 /startup-os:desk，或對 AI 說「打開 Founder Desk」，即可重新開啟。')));
  }

  /* ---------- AI 未設定：置頂阻塞卡（待決事項、交資料、答題都有） ---------- */
  function aiBlock(st) {
    if (!st || st.cert) return null;
    var running = st.certify && st.certify.state === 'running';
    return h('section', { class: 'layer block', id: 'ai-block' },
      h('span', { class: 'eyebrow' }, N.ui.aiNotSet),
      h('div', { class: 'row' },
        h('div', null, h('div', { class: 't' }, N.ui.aiNotSet, ' ', running ? tag(N.ui.certChecking, 'qn') : null),
          h('div', { class: 'small muted' }, running ? 'AI 工具正在認證，通常一分鐘內完成。' : 'AI 設定完成前，你提交的資料與答案仍會記錄，但 AI 不會跟進；設定完成後將自動繼續。')),
        h('a', { class: 'btn primary', href: '#/setup', id: 'go-setup' }, N.ui.goSetup)));
  }
  function waitingNote(r) {
    var ai = r && (r.steps || []).filter(function (s) { return s.key === 'ai'; })[0];
    return [h('p', null, (ai && ai.detail) || 'AI 尚未設定，設定完成後將自動繼續。'), h('div', { class: 'foot' }, h('a', { class: 'btn primary', href: '/#/setup' }, N.ui.goSetup))];
  }

  /* ---------- 待決事項（Founder Desk 首頁） ---------- */
  function trRow(state, label, sub) {
    return h('li', null, h('span', { class: 'tr-ic ' + state }, state === 'done' ? '✓' : state === 'failed' ? '✕' : state === 'running' ? '…' : '○'),
      h('span', null, label, sub ? h('span', { class: 'tr-sub' }, sub) : null));
  }
  // 「今日要做的事」卡（安裝後至首次訪問完成為止常駐，之後收成「第一星期指引」）同「上次離開之後」一行（規劃書 4.1）
  // 陶土場景圖：每個指引狀態一張（未交資料會直接轉去交資料頁、日常已收入「第一星期指引」，兩者都唔放圖）；載入失敗（例如離線快照）就靜靜收埋
  var SCENE = { noAI: 'ready', proofread: 'goal', accept: 'handover', firstInterview: 'evidence', empty: 'rhythm', autoStop: 'sitting' };
  function scene(key) {
    return SCENE[key] ? h('div', { class: 'scene-bg', 'aria-hidden': 'true', style: "background-image:url('/assets/clay-scene-" + SCENE[key] + ".webp')" }) : null;
  }

      else if (!IN.files.some(function (x) { return x.name === f.name && x.size === f.size; })) IN.files.push(f);
    });
    IN.err = msgs.join(' ');
    renderFiles();
  }
  function renderFiles() {
    var box = $('#file-list'); if (!box) return;
    box.replaceChildren();
    IN.files.forEach(function (f, i) {
      box.append(h('div', { class: 'file-row' }, h('span', null, f.name), h('span', { class: 'small muted' }, fmtSize(f.size)),
        h('button', { type: 'button', class: 'btn small', onclick: function () { IN.files.splice(i, 1); renderFiles(); } }, N.ui.removeFile)));
    });
    var e = $('#intake-err'); if (e) e.textContent = IN.err || '';
    pfBox();
  }
  /* 由文件預填：每題狀態存喺草稿 _prefill.st[q] = { s, a, alt }
     s：pending（答案係 AI 預填、未確認）／confirmed（創辦人確認咗呢句）／offer（答案係創辦人自己寫，預填只作建議）；a：嗰句預填（文字、標籤、出處）；alt：再預填時嘅新建議 */
  function pfNorm(s) { return String(s || '').replace(/[\s　]+/g, ''); }
  function pfSt() { var p = draftLoad()._prefill; return (p && p.st) || {}; }
  function pfDoc(f) { return String(f || '').replace(/\.[A-Za-z0-9]{1,5}$/, ''); }
  function pfFrom(a) { return (a.source ? T('prefillFrom', { f: pfDoc(a.source) }) : N.ui.prefillFromAny) + (a.at ? T('prefillAt', { a: a.at }) : ''); }
  function pfTag(a) { return a.label === 'quote' ? N.ui.prefillTagQuote : a.label === 'unverified' ? N.ui.prefillTagUnverified : N.ui.prefillTagInferred; }
  function pfDoneTag(a) { return a.label === 'quote' ? T('srcYouDoc', { f: pfDoc(a.source) || '你的文件' }) : a.label === 'unverified' ? N.ui.srcAdoptedUnverified : N.ui.srcAdopted; }
  function pfQs() { return IN.meta.questions.filter(function (q) { return q.required; }).map(function (q) { return 'q' + q.n; }); }
  function pfPut(q, text, c) { var d = draftLoad(), ta = $('#' + q); if (ta) ta.value = text; d[q] = text; d._prefill = d._prefill || { id: PF.id, st: {} }; d._prefill.st[q] = c; draftSave(d); pfRow(q); intakeBar(); }
  // 創辦人改字：同預填一樣就仍要確認；唔一樣就係佢自己寫嘅
  function pfEdited(dd, q, v) {
    var c = dd._prefill && dd._prefill.st && dd._prefill.st[q]; if (!c) return;
    if (pfNorm(v) === pfNorm(c.a.text)) { if (c.s !== 'confirmed') c.s = 'pending'; }
    else if (c.alt && pfNorm(v) === pfNorm(c.alt.text)) { c.a = c.alt; delete c.alt; c.s = 'pending'; }
    else c.s = 'offer';
  }
  function pfPending() { var st = pfSt(); return Object.keys(st).filter(function (q) { var ta = $('#' + q); return st[q].s === 'pending' && ta && ta.value.trim() && pfNorm(ta.value) === pfNorm(st[q].a.text); }); }
  // 送出：只講邊幾條創辦人確認咗；伺服器按預填紀錄重新判定來源
  function pfClaims() {
    var p = draftLoad()._prefill; if (!p || !p.id) return null;
    var claims = {};
    Object.keys(p.st || {}).forEach(function (q) { var c = p.st[q], ta = $('#' + q); if (c.s === 'confirmed' && ta && pfNorm(ta.value) === pfNorm(c.a.text)) claims[q] = 'confirmed'; });
    return { id: p.id, claims: claims };
  }
  function pfSource(q, v) {
    var st = pfSt(), c = st[q];
    if (c && c.s === 'confirmed' && pfNorm(c.a.text) === pfNorm(v)) return pfDoneTag(c.a);
    var any = Object.keys(st).some(function (k) { var x = st[k]; return [x.a, x.alt].some(function (a) { return a && pfNorm(a.text) === pfNorm(v); }); });
    return any ? N.ui.srcMoved : N.ui.srcYou;
  }
  function pfOffer(q, x) {
    return h('div', { class: 'pf-offer' }, h('span', { class: 'small' }, N.ui.prefillSuggest + '「' + clip(x.text, 160) + '」'), ' ', tag(pfTag(x), 'ai'), ' ', h('span', { class: 'small muted' }, pfFrom(x)), ' ',
      h('button', { type: 'button', class: 'btn small', 'data-pf-use': q, onclick: function () { pfPut(q, x.text, { s: 'confirmed', a: x }); } }, N.ui.prefillUse));
  }
  function pfRow(q) {
    var box = $('#pf-' + q); if (!box) return;
    box.replaceChildren();
    var c = pfSt()[q], ta = $('#' + q);
    if (!c) { if (PF.data && (PF.data.missing || []).indexOf(q) >= 0 && ta && !ta.value.trim()) box.append(h('span', { class: 'small muted' }, N.ui.prefillNone)); return; }
    if (c.s === 'pending') box.append(tag(pfTag(c.a), 'ai'), ' ', h('span', { class: 'small muted' }, pfFrom(c.a)), ' ',
      h('button', { type: 'button', class: 'btn small', 'data-pf-confirm': q, onclick: function () { pfPut(q, ta.value, { s: 'confirmed', a: c.a }); } }, N.ui.prefillConfirm));
    else if (c.s === 'confirmed') { box.append(tag(pfDoneTag(c.a), 'mine'), ' ', h('span', { class: 'small muted' }, c.a.label === 'quote' ? (c.a.at ? T('prefillAt', { a: c.a.at }) : '') : pfFrom(c.a))); if (c.alt) box.append(pfOffer(q, c.alt)); }
    else box.append(pfOffer(q, c.a));
  }
  function pfAll() { pfQs().forEach(pfRow); }
  // 預填到咗：空格填入（待確認）；創辦人已經寫咗嘅唔覆蓋，只顯示建議
  function pfApply() {
    var d = draftLoad(); d._prefill = d._prefill && d._prefill.id === PF.id ? d._prefill : { id: PF.id, st: {} };
    if (d._prefill.applied === PF.id) return;
    var st = d._prefill.st;
    Object.keys(PF.data.answers || {}).forEach(function (q) {
      var a = PF.data.answers[q], ta = $('#' + q), cur = st[q]; if (!ta) return;
      if (!cur) { if (!ta.value.trim()) { ta.value = a.text; d[q] = a.text; st[q] = { s: 'pending', a: a }; } else st[q] = { s: pfNorm(ta.value) === pfNorm(a.text) ? 'pending' : 'offer', a: a }; }
      else if (cur.s === 'confirmed') { if (pfNorm(cur.a.text) !== pfNorm(a.text)) cur.alt = a; }
      else if (cur.s === 'offer') cur.a = a;
    });
    d._prefill.applied = PF.id; draftSave(d);
  }
  function pfBox() {
    var box = $('#pf-box'); if (!box) return;
    box.replaceChildren();
    var running = !!PF.id && !PF.data && !PF.err;
    box.append(h('div', { class: 'pf-go' }, h('button', { type: 'button', class: 'btn primary', id: 'pf-go', disabled: !IN.files.length || running ? true : null, onclick: pfStart }, N.ui.prefillGo),
      h('span', { class: 'small muted' }, N.ui.prefillGoNote)));
    if (running) box.append(h('p', { class: 'small', id: 'pf-state', 'aria-live': 'polite' }, PF.wait ? N.ui.aiNotSet : N.ui.prefillRunning));
    else if (PF.err) box.append(h('p', { class: 'small', id: 'pf-state', role: 'alert', style: 'color:var(--red)' }, PF.err));
    else if (PF.data) box.append(h('p', { class: 'small', id: 'pf-state' }, T('prefillDone', { n: Object.keys(PF.data.answers || {}).length })));
  }
  function readFiles(list) {
    return Promise.all(list.map(function (f) {
      return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res({ name: f.name, data: String(fr.result).split(',')[1] || '' }); }; fr.onerror = function () { rej(new Error('無法讀取「' + f.name + '」')); }; fr.readAsDataURL(f); });
    }));
  }
  function pfStart() {
    var b = $('#pf-go'); if (b) b.disabled = true;
    readFiles(IN.files).then(function (files) {
      return fetch('/api/intake', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind: 'prefill', files: files }) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.message || '伺服器拒絕接收'); return j; }); });
    }).then(function (j) {
      // 再預填：未確認嘅舊預填清走；已確認嘅保留，新建議另外顯示
      var d = draftLoad(), st = (d._prefill && d._prefill.st) || {};
      Object.keys(st).forEach(function (q) { var c = st[q]; if (c.s === 'pending') { if (pfNorm(d[q]) === pfNorm(c.a.text)) { d[q] = ''; var ta = $('#' + q); if (ta) ta.value = ''; } delete st[q]; } });
      d._prefill = { id: j.id, applied: '', st: st }; draftSave(d);
      PF = { id: j.id, data: null, err: '' }; pfBox(); pfAll(); intakeBar(); pfPoll();
    }).catch(function (e) { PF.err = '未能交出文件：' + e.message; pfBox(); PF.err = ''; });
  }
  function pfPoll() {
    clearTimeout(V.pollTimer);
    if (!PF.id || PF.data || !$('#intake-form')) return;
    get('/api/prefill?id=' + encodeURIComponent(PF.id)).then(function (j) {
      if (j.state === 'done') { PF.data = j.prefill; pfApply(); pfBox(); pfAll(); intakeBar(); return; }
      if (j.state === 'failed') { PF.err = N.ui.prefillFailed + (j.error ? '：' + N.fix(j.error) : ''); pfBox(); return; }
      PF.wait = j.state === 'waiting'; pfBox();
      V.pollTimer = setTimeout(pfPoll, PF.wait ? 4000 : 2000);
    }).catch(function (e) {
      if (e.message === '404') { PF.err = N.ui.prefillLost; pfBox(); return; }
      V.pollTimer = setTimeout(pfPoll, 5000);
    });
  }
  function intakeBar() {
    var bar = $('#cbar');
    if (!$('#intake-form')) { bar.hidden = true; return; }
    var req = IN.meta.questions.filter(function (q) { return q.required; });
    var done = req.filter(function (q) { var x = $('#q' + q.n); return x && x.value.trim(); });
    var missing = req.filter(function (q) { return done.indexOf(q) < 0; }), waitPf = pfPending();
    bar.hidden = false;
    bar.replaceChildren(h('div', { class: 'cbar-in' },
      h('div', { class: 'prog' },
        h('div', { class: 'prog-top' }, h('b', { class: 'prog-n' }, T('requiredProgress', { n: done.length, t: req.length })),
          missing.length ? h('span', { class: 'small muted' }, '尚欠第 ' + missing.map(function (q) { return q.n; }).join('、') + ' 題') : null,
          waitPf.length ? h('span', { class: 'small', id: 'pf-wait', style: 'color:var(--amber)' }, T('prefillPending', { n: waitPf.length })) : null),
        h('div', { class: 'prog-bar' + (missing.length ? '' : ' full'), role: 'progressbar', 'aria-label': N.ui.required, 'aria-valuemin': '0', 'aria-valuemax': String(req.length), 'aria-valuenow': String(done.length) },
          h('i', { style: 'width:' + Math.round(done.length / req.length * 100) + '%' }))),
      h('button', { type: 'button', class: 'btn primary big', id: 'intake-go', disabled: missing.length || waitPf.length ? true : null, onclick: intakeModal }, N.ui.submitIntake)));
    document.body.style.paddingBottom = (bar.offsetHeight + 28) + 'px';
  }
  function intakeModal() {
    lastFocus = document.activeElement;
    var qs = IN.meta.questions, val = function (q) { var x = $('#q' + q.n); return x ? x.value : ''; };
    var filled = qs.filter(function (q) { return val(q).trim(); });
    var btn = h('button', { type: 'button', class: 'btn primary', id: 'intake-confirm', onclick: send }, N.ui.submit);
    var msg = h('p', { class: 'small', role: 'alert', style: 'color:var(--red)' });
    function send() {
      var fields = {}; qs.forEach(function (q) { fields['q' + q.n] = val(q); });
      btn.disabled = true; btn.textContent = N.ui.uploading;
      Promise.all(IN.files.map(function (f) {
        return new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res({ name: f.name, data: String(fr.result).split(',')[1] || '' }); }; fr.onerror = function () { rej(new Error('無法讀取「' + f.name + '」')); }; fr.readAsDataURL(f); });
      })).then(function (files) {
        var pf = pfClaims();
        return fetch('/api/intake', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(pf ? { fields: fields, files: files, prefillId: pf.id, provenance: pf.claims } : { fields: fields, files: files }) })
          .then(function (r) { return r.json().then(function (j) { if (!r.ok || !j.ok) throw new Error(j.message || '伺服器拒絕接收'); return j; }); });
      }).then(function (j) {
        draftClear(); IN.files = []; IN.open = false; IN.sent = { id: j.id, at: j.receivedAt }; PF = { id: '', state: '', data: null, err: '' };
        closeModal(); toast(N.ui.sent); window.scrollTo(0, 0); showIntake();
      }).catch(function (e) { btn.disabled = false; btn.textContent = N.ui.submit; msg.textContent = '未能送出：' + e.message; });
    }
    var dlg = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mt' },
      h('div', { class: 'm-head' }, h('span', { class: 'eyebrow' }, N.ui.replyBox), h('h3', { id: 'mt' }, N.ui.submitIntake), h('p', { class: 'small muted' }, '按確認後即交予 AI 擬定公司概覽；不會對外發送任何內容。')),
      h('div', { class: 'm-body' },
        h('div', { class: 'effect', style: 'border-left-color:var(--mint);border-color:rgba(153,215,188,.3);background:transparent' }, h('h4', null, N.ui.intakeTitle),
          h('ul', { class: 'm-sum' }, filled.map(function (q) { return h('li', null, h('b', null, q.n + '. ' + q.ask + '：'), clip(val(q), 80), ' ', tag(pfSource('q' + q.n, val(q)), 'src')); }))),
        IN.files.length ? h('div', { class: 'effect', style: 'border-left-color:var(--mint);border-color:rgba(153,215,188,.3);background:transparent' }, h('h4', null, N.ui.files + '（' + IN.files.length + '）'),
          h('ul', { class: 'm-sum' }, IN.files.map(function (f) { return h('li', null, f.name + '（' + fmtSize(f.size) + '）'); }))) : null,
        msg),
      h('div', { class: 'm-foot' }, h('button', { type: 'button', class: 'btn', onclick: closeModal }, N.ui.back), btn));
    var back = h('div', { class: 'backdrop', onclick: function (ev) { if (ev.target === back) closeModal(); } }, dlg);
    $('#modal-root').replaceChildren(back);
    document.addEventListener('keydown', modalKeys, true);
    btn.focus();
  }

  /* ---------- 決定紀錄：AI 原建議、你的答案、AI 後續工作 ---------- */
  var LOGF = 'all';
  function showLog() {
    Promise.all([get('/api/log'), get('/api/status')]).then(function (r) {
      var j = r[0], st = r[1]; V.status = st; checkInstance(st);
      var entries = j.entries.filter(function (e) { return LOGF === 'all' || e.changed; });
      var groups = [], byKey = {};
      entries.forEach(function (e) {
        var k = e.reply || e.at;
        if (!byKey[k]) { byKey[k] = { key: k, at: e.at, title: e.packTitle, runId: e.runId, items: [] }; groups.push(byKey[k]); }
        byKey[k].items.push(e);
      });
      var body = [], lastDay = '';
      groups.forEach(function (g) {
        var d = dayOf(g.at);
        if (d !== lastDay) { body.push(h('div', { class: 'log-day' }, d)); lastDay = d; }
        var runBox = h('div');
        var changedAny = g.items.some(function (e) { return e.changed; });
        body.push(h('section', { class: 'layer log-item' + (changedAny ? ' chg' : '') },
          h('span', { class: 'eyebrow' }, hm(g.at) + ' · ' + T('answeredN', { n: g.items.filter(function (e) { return e.qid !== 'rest'; }).length })),
          h('h2', { class: 'layer-title' }, N.fix(g.title)),
          h('ul', { class: 'qa' }, g.items.map(function (e) {
            return h('li', null, h('div', { class: 'q' }, N.fix(e.question)),
              h('div', { class: 'a' }, h('span', null, e.source === 'proofread' ? N.fix(e.answer) : e.answer), e.changed ? tag(N.ui.changed, 'mine') : e.confirmedSame ? tag(N.ui.confirmedSame, 'mine') : h('span', { class: 'adopted' }, N.ui.adopted), e.effect === 'now' ? tag(N.ui.now, 'eff') : null),
              e.changed && e.ai ? h('div', { class: 'ai' }, N.ui.aiOrig + '：' + e.ai) : null);
          })),
          g.runId ? h('div', { class: 'foot' }, h('button', { type: 'button', class: 'btn', onclick: function () {
            get('/api/run?id=' + encodeURIComponent(g.runId)).then(function (rr) { runBox.replaceChildren(resultBox(rr.run)); })
              .catch(function () { runBox.replaceChildren(h('p', { class: 'tr-sub' }, 'AI 尚未完成，或此次毋須 AI 跟進。')); });
          } }, N.ui.viewAfter)) : null, runBox));
      });
      setApp(head('log', st),
        DESK.logFilters('decisions'),
        h('p', { class: 'guide' }, '每次確認均會記錄：AI 原本建議、你的答案，以及 AI 隨後的工作。'),
        h('div', { class: 'tabs logf' },
          h('button', { type: 'button', class: 'btn' + (LOGF === 'all' ? ' on' : ''), onclick: function () { LOGF = 'all'; showLog(); } }, N.ui.all),
          h('button', { type: 'button', class: 'btn' + (LOGF === 'changed' ? ' on' : ''), onclick: function () { LOGF = 'changed'; showLog(); } }, N.ui.onlyChanged)),
        body.length ? body : h('p', { class: 'empty' }, N.ui.noLog));
      DESK.title('log');
    }).catch(function () { fail('無法連接本機伺服器。'); });
  }

  if (!/^https?:$/.test(location.protocol)) return; // 直接開檔：保留靜態提示
  window.addEventListener('hashchange', route);
  // 創辦人返嚟呢個分頁時核對一次：伺服器重新開過就提示重新載入
  window.addEventListener('focus', function () { get('/api/status').then(checkInstance).catch(function () { }); });
  route();
})();
